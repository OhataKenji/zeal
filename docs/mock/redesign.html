                    <td class="mono" style="color:var(--fg-dim)">${esc(a.config.mnemonic)}${a.config.isTool ? " · tool" : ""}</td>
                    <td class="mono" style="text-align:right;color:var(--fg-dim)">${a.inputs.length}</td>
                  </tr>`,
                    )
                    .join("")}</tbody></table>`
            }`;
        }

        return `
          <div class="view-head">
            <div>
              <div class="text-tabs" role="tablist" style="margin-bottom:3px">
                <button class="text-tab mono" style="font-size:14px" role="tab" aria-selected="${state.queryMode === "query"}" onclick="openQueryInMode('query')">query</button>
                <button class="text-tab mono" style="font-size:14px" role="tab" aria-selected="${state.queryMode === "cquery"}" onclick="openQueryInMode('cquery')">cquery</button>
                <button class="text-tab mono" style="font-size:14px" role="tab" aria-selected="${state.queryMode === "aquery"}" onclick="openQueryInMode('aquery')">aquery</button>
              </div>
              <div class="view-meta">${meta[state.queryMode]}</div>
            </div>
            <button class="btn btn-primary" onclick="state.queryStale=false;renderMain();toast('Executed bazel ${state.queryMode}')">Run <span class="mono" style="opacity:0.7;font-size:10.5px">⌘↵</span></button>
          </div>

          <div class="query-composer">
            <div class="composer-bar">
              <div style="display:flex;align-items:center;gap:10px">
                <div class="sub-switch">
                  <button class="${state.queryEditMode === "builder" ? "active" : ""}" onclick="setQueryEditMode('builder')">Builder</button>
                  <button class="${state.queryEditMode === "code" ? "active" : ""}" onclick="setQueryEditMode('code')">Code</button>
                </div>
                <details class="dd">
                  <summary class="ghost-btn">Examples ▾</summary>
                  <div class="dd-menu">
                    <div class="popover-group">${esc(state.queryMode)} examples</div>
                    ${examples.map((ex, i) => `<button class="menu-item" onclick="closeAllPopovers();loadQueryExample(${i})">${esc(ex.label)}</button>`).join("")}
                  </div>
                </details>
              </div>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                ${
                  state.queryMode === "query"
                    ? `<button class="ghost-btn mono" style="font-size:11.5px;color:${state.queryNoImplicit ? "var(--fg)" : "var(--fg-dim)"}" onclick="state.queryNoImplicit=!state.queryNoImplicit;state.queryStale=true;renderMain()">${state.queryNoImplicit ? "✓" : "·"} --noimplicit_deps</button>
                       <button class="ghost-btn mono" style="font-size:11.5px;color:${state.queryNoTool ? "var(--fg)" : "var(--fg-dim)"}" onclick="state.queryNoTool=!state.queryNoTool;state.queryStale=true;renderMain()">${state.queryNoTool ? "✓" : "·"} --notool_deps</button>`
                    : `<input class="input mono" id="q-build-flags" style="width:210px" value="${esc(state.queryBuildFlags)}" placeholder="Build flags, e.g. --config=opt" />
                       ${state.queryMode === "cquery" ? `<button class="ghost-btn mono" style="font-size:11.5px;color:${state.queryTransitions ? "var(--fg)" : "var(--fg-dim)"}" onclick="state.queryTransitions=!state.queryTransitions;state.queryStale=true;renderMain()">${state.queryTransitions ? "✓" : "·"} --transitions=lite</button>` : ""}`
                }
              </div>
            </div>
            ${state.queryEditMode === "builder" ? renderAstBuilder(state.queryAst) : `<textarea class="input mono" id="q-code-input" rows="2" style="height:auto;padding:7px 9px">${esc(state.queryExpr)}</textarea>`}
            ${state.queryCodeError ? `<div class="callout callout-warn" style="margin:8px 0 0;display:flex;justify-content:space-between;align-items:center"><span>${esc(state.queryCodeError)}</span><button class="link link-accent" onclick="revertToBuilder()">Revert to Builder</button></div>` : ""}
            <div class="cmd-preview"><button id="query-cmd-text" onclick="copyCurrentQuery()" title="Click to copy">$ ${esc(currentQueryCommand())}</button></div>
          </div>
          ${results}`;
      }

      function renderTimelineRuler(totalMs) {
        const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => fmtMs(totalMs * f));
        return `<div class="tl-row tl-ruler"><div class="tl-label" style="color:var(--fg-dim)">time</div><div class="tl-ruler-ticks">${ticks.map((t) => `<span>${t}</span>`).join("")}</div></div>`;
      }

      function renderInvocation() {
        const inv = INVOCATIONS.find((i) => i.id === state.selectedInvId) || INVOCATIONS[0];
        const dot =
          inv.outcome === "running" ? "dot-run" : inv.outcome === "ok" ? "dot-ok" : "dot-err";
        const failedTests = inv.tests.filter((t) => t.status === "FAILED");
        const flakyTests = inv.tests.filter((t) => t.status === "FLAKY");
        const failedTargets = inv.targets.filter((t) => !t.ok);
        const issueCount = failedTests.length + flakyTests.length + failedTargets.length;
        const fullPatternStr = inv.patterns.join(" ");
        const safeAqueryExpr = `deps(${patternsToSetExpr(inv.patterns)})`;
        const isOtherWs = inv.wsId !== state.activeWsId;

        let headerRight = "";
        if (inv.outcome === "running") {
          headerRight = inv.ownedByZeal
            ? `<button class="btn btn-danger" title="Stop" aria-label="Stop" style="width:28px;padding:0" onclick="toast('Sent SIGINT to Bazel process')"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" rx="1.2" fill="currentColor"/></svg></button>`
            : `<span class="mono" style="font-size:11.5px;color:var(--fg-dim)">External BES stream (read-only)</span>`;
        } else {
          headerRight = `<button class="btn btn-primary" onclick="runBazel('${inv.cmd}', '${esc(fullPatternStr)}', '${esc(inv.explicitFlags.join(" "))}', '${inv.wsId}')">Re-run</button>`;
        }

        const timelineHtml =
          inv.profileStatus !== "ok"
            ? `<div class="callout">Profile timing is available after completion.</div>`
            : `<div class="timeline-canvas">
              ${renderTimelineRuler(inv.durationMs)}
              ${inv.phases.map((p) => `<div class="tl-row"><div class="tl-label"><span>${esc(p.name)}</span><span style="color:var(--fg-dim)">${fmtMs(p.endMs - p.startMs)}</span></div><div class="tl-track"><div class="tl-bar phase ${p.exec ? "phase-exec" : ""}" style="left:${(p.startMs / inv.durationMs) * 100}%;width:${Math.max(4, ((p.endMs - p.startMs) / inv.durationMs) * 100)}%"></div></div></div>`).join("")}
              ${inv.lanes.map((l) => `<div class="tl-row"><div class="tl-label"><span>${esc(l.name)}</span><span style="color:var(--fg-dim)">tid ${l.tid}</span></div><div class="tl-track">${l.spans.map((sp) => `<button class="tl-bar ${state.inspector?.id === sp.id ? "selected" : ""} ${sp.failed ? "failed" : ""}" style="left:${(sp.startMs / inv.durationMs) * 100}%;width:${Math.max(4, ((sp.endMs - sp.startMs) / inv.durationMs) * 100)}%" onclick="pushInspector({kind:'event',id:'${sp.id}',tab:'d'}, false);render()">${esc(sp.name)}</button>`).join("")}</div></div>`).join("")}
            </div>`;

        const resTab =
          issueCount === 0 && state.invResultTab === "issues"
            ? inv.tests.length
              ? "tests"
              : "targets"
            : state.invResultTab;
        const sq = state.invResultSearch.trim().toLowerCase();
        let resultRowsHtml = "";
        if (resTab === "issues") {
          const issueRows = [
            ...failedTests.map((t) => ({
              kind: "test",
              label: t.label,
              status: "FAILED",
              dot: "dot-err",
            })),
            ...flakyTests.map((t) => ({
              kind: "test",
              label: t.label,
              status: "FLAKY",
              dot: "dot-warn",
            })),
            ...failedTargets.map((t) => ({
              kind: "target",
              label: t.label,
              status: "FAILED",
              dot: "dot-err",
            })),
          ].filter((r) => !sq || r.label.toLowerCase().includes(sq));
          resultRowsHtml = issueRows
            .map(
              (r) =>
                `<tr class="clickable" onclick="${r.kind === "test" ? `pushInspector({kind:'testlog',id:'${r.label}',tab:'raw'}, false);render()` : `inspectTarget('${r.label}', true)`}"><td style="width:16px"><span class="dot ${r.dot}"></span></td><td class="mono">${esc(r.label)}</td><td class="mono" style="color:${r.status === "FLAKY" ? "var(--warn)" : "var(--err)"};text-align:right;font-size:11.5px">${esc(r.status)}${r.kind === "test" ? " · test.log" : ""}</td></tr>`,
            )
            .join("");
        } else if (resTab === "tests") {
          resultRowsHtml = inv.tests
            .filter((t) => !sq || t.label.toLowerCase().includes(sq))
            .map(
              (t) =>
                `<tr class="clickable" onclick="pushInspector({kind:'testlog',id:'${t.label}',tab:'raw'}, false);render()"><td style="width:16px"><span class="dot ${t.status === "PASSED" ? "dot-ok" : t.status === "FLAKY" ? "dot-warn" : "dot-err"}"></span></td><td class="mono">${esc(t.label)}</td><td class="mono" style="color:${t.status === "PASSED" ? "var(--fg-dim)" : t.status === "FLAKY" ? "var(--warn)" : "var(--err)"};text-align:right;font-size:11.5px">${esc(t.status)} · test.log</td></tr>`,
            )
            .join("");
        } else {
          const shownTargets = inv.targets.filter((t) => !sq || t.label.toLowerCase().includes(sq));
          const more = Math.max(
            0,
            (inv.targetTotalCount || inv.targets.length) - inv.targets.length,
          );
          resultRowsHtml =
            shownTargets
              .map(
                (t) =>
                  `<tr class="clickable" onclick="inspectTarget('${t.label}', true)"><td style="width:16px"><span class="dot ${t.ok ? "dot-ok" : "dot-err"}"></span></td><td class="mono">${esc(t.label)}</td><td class="mono" style="color:var(--fg-dim);text-align:right;font-size:11.5px">${esc(t.config)}</td></tr>`,
              )
              .join("") +
            (more > 0 && !sq
              ? `<tr><td colspan="3" style="color:var(--fg-dim);font-size:11.5px" class="mono">+ ${more} more completed targets</td></tr>`
              : "");
        }

        const wsObj = WORKSPACES.find((w) => w.id === inv.wsId);
        const targetsSectionHtml = `
          ${inv.outcome === "failed" ? `<div class="callout callout-err"><pre style="color:var(--err)">${esc(inv.errorExcerpt || inv.log)}</pre></div>` : ""}
          ${inv.analysisCacheDiscarded ? `<div class="callout callout-warn clickable" onclick="state.invTab='compare';renderMain()"><strong style="color:var(--warn)">Analysis cache discarded</strong> · ${esc(inv.analysisCacheDiscarded)}</div>` : ""}
          <div class="section-head">
            <div class="sub-switch">
              ${issueCount ? `<button class="${resTab === "issues" ? "active" : ""}" onclick="state.invResultTab='issues';renderMain()">Issues (${issueCount})</button>` : ""}
              ${inv.tests.length ? `<button class="${resTab === "tests" ? "active" : ""}" onclick="state.invResultTab='tests';renderMain()">Tests (${inv.tests.length})</button>` : ""}
              <button class="${resTab === "targets" ? "active" : ""}" onclick="state.invResultTab='targets';renderMain()">Targets (${inv.targetTotalCount || inv.targets.length})</button>
            </div>
            <input class="input" id="inv-res-search" style="width:190px" placeholder="Filter results…" value="${esc(state.invResultSearch)}" />
          </div>
          <table class="lens-table"><tbody>${resultRowsHtml || `<tr><td style="color:var(--fg-dim)">${inv.outcome === "running" ? "Streaming build events…" : "No matching results."}</td></tr>`}</tbody></table>`;

        const origCmd = formatBazelCli(inv.cmd, inv.patterns, inv.explicitFlags.join(" "));
        const canonCmd = formatBazelCli(inv.cmd, inv.patterns, inv.effectiveFlags.join(" "));
        const cacheSummaryHtml = (() => {
          const sum = inv.actionSummary;
          if (!sum || !sum.total) return "";
          const cached = sum.runners.filter((r) => r.cached).reduce((s, r) => s + r.count, 0);
          const hitPct = Math.round((cached / sum.total) * 100);
          return `<div style="margin-bottom:16px">
            <div class="section-head" style="margin-bottom:4px">
              <h3 class="section-title">Action Cache (BEP)</h3>
              <span class="mono" style="font-size:11.5px;color:var(--fg)">${cached} / ${sum.total} cached <span style="color:var(--ok)">(${hitPct}%)</span></span>
            </div>
            <div class="cache-bar">
              <div style="width:${hitPct}%;background:var(--ok);opacity:0.8"></div>
              <div style="width:${100 - hitPct}%;background:#3a5264"></div>
            </div>
            <div class="legend" style="margin-top:4px">${sum.runners.map((r) => `<span class="legend-item mono"><i class="sw" style="background:${r.cached ? "var(--ok)" : "#3a5264"}"></i>${esc(r.name)}: ${r.count}</span>`).join("")}</div>
          </div>`;
        })();
        const detailsSectionHtml = `
          ${cacheSummaryHtml}
          <dl class="kv" style="margin-bottom:16px">
            <dt>Command</dt><dd class="mono">${esc(inv.cmd)}</dd>
            <dt>Pattern</dt><dd class="mono">${esc(fullPatternStr)}</dd>
            <dt>Workspace</dt><dd class="mono" style="color:var(--fg-muted)">${esc(wsObj?.path || inv.wsLabel)}</dd>
            <dt>Invocation ID</dt><dd class="mono" style="color:var(--fg-muted)">${esc(inv.id)}</dd>
            <dt>Started</dt><dd class="mono" style="color:var(--fg-muted)">${esc(inv.day)} (${esc(inv.time)})</dd>
            <dt>Exit code</dt><dd class="mono">${inv.exitCode === null ? "Running" : inv.exitCode}</dd>
            <dt>Wall time</dt><dd class="mono">${inv.outcome === "running" ? "Running…" : fmtMs(inv.durationMs)}</dd>
          </dl>
          <div class="section-head"><h3 class="section-title">Options</h3></div>
          <div style="margin-bottom:10px"><div style="font-size:11.5px;color:var(--fg-dim);margin-bottom:4px">Explicit command options</div><pre class="code-box">${esc(inv.explicitFlags.join(" ") || "No command options.")}</pre></div>
          <div style="margin-bottom:14px"><div style="font-size:11.5px;color:var(--fg-dim);margin-bottom:4px">Effective command options</div><pre class="code-box">${esc(inv.effectiveFlags.join(" ") || "No command options.")}</pre></div>
          <div class="section-head"><h3 class="section-title">Command lines</h3></div>
          <details class="flat-detail"><summary>Canonical command line</summary><div class="detail-body"><pre class="code-box">${esc(canonCmd)}</pre></div></details>
          <details class="flat-detail"><summary>Original command line</summary><div class="detail-body"><pre class="code-box">${esc(origCmd)}</pre></div></details>
          <details class="flat-detail"><summary>Startup options</summary><div class="detail-body"><pre class="code-box">${esc(inv.startupOptions.join(" ") || "None")}</pre></div></details>`;

        const logsSectionHtml = `<pre class="code-box" style="cursor:pointer" onclick="copyText(this.textContent, 'Copied log')" title="Click to copy">${esc(inv.log)}</pre>`;

        let body = "";
        if (state.invTab === "all") {
          body = `
            <section class="section"><div class="section-head"><h2 class="section-title">Targets</h2></div>${targetsSectionHtml}</section>
            <section class="section"><div class="section-head"><h2 class="section-title">Details</h2></div>${detailsSectionHtml}</section>
            <section class="section"><div class="section-head"><h2 class="section-title">Logs</h2></div>${logsSectionHtml}</section>
            <section class="section"><div class="section-head"><h2 class="section-title">Timing</h2></div>${timelineHtml}</section>`;
        } else if (state.invTab === "targets") {
          body = targetsSectionHtml;
        } else if (state.invTab === "details") {
          body = detailsSectionHtml;
        } else if (state.invTab === "logs") {
          body = logsSectionHtml;
        } else if (state.invTab === "timing") {
          body = timelineHtml;
        } else {
          const right =
            INVOCATIONS.find((i) => i.id === state.compareRightId) ||
            INVOCATIONS.find((i) => i.id !== inv.id && i.outcome !== "running") ||
            inv;
          const diffList = (a, b) => ({
            l:
              [
                ...a
                  .filter((x) => !b.includes(x))
                  .map((x) => `<div class="diff-add">+ ${esc(x)}</div>`),
                ...a
                  .filter((x) => b.includes(x))
                  .map((x) => `<div style="color:var(--fg-dim)">&nbsp; ${esc(x)}</div>`),
              ].join("") || '<span style="color:var(--fg-dim)">—</span>',
            r:
              [
                ...b
                  .filter((x) => !a.includes(x))
                  .map((x) => `<div class="diff-del">- ${esc(x)}</div>`),
                ...a
                  .filter((x) => b.includes(x))
                  .map((x) => `<div style="color:var(--fg-dim)">&nbsp; ${esc(x)}</div>`),
              ].join("") || '<span style="color:var(--fg-dim)">—</span>',
          });
          const exp = diffList(inv.explicitFlags, right.explicitFlags),
            eff = diffList(inv.effectiveFlags, right.effectiveFlags);

          body = `
            <div class="section-head" style="margin-bottom:12px">
              <span class="section-title">Baseline</span>
              <select class="input mono" id="compare-select" style="width:340px">
                ${INVOCATIONS.filter((i) => i.id !== inv.id && i.outcome !== "running")
                  .map(
                    (i) =>
                      `<option value="${i.id}" ${i.id === right.id ? "selected" : ""}>${esc(i.wsLabel)} · ${esc(i.cmd)} ${esc(patternSummary(i))} · ${fmtMs(i.durationMs)}</option>`,
                  )
                  .join("")}
              </select>
            </div>
            <table class="lens-table">
              <thead><tr><th style="width:155px">Facet</th><th>Current (${esc(inv.wsLabel)})</th><th>Baseline (${esc(right.wsLabel)})</th></tr></thead>
              <tbody>
                <tr><td style="color:var(--fg-muted)">Patterns</td><td class="mono">${esc(inv.patterns.join(" "))}</td><td class="mono" style="color:var(--fg-muted)">${esc(right.patterns.join(" "))}</td></tr>
                <tr><td style="color:var(--fg-muted)">Wall time</td><td class="mono">${fmtMs(inv.durationMs)}</td><td class="mono">${fmtMs(right.durationMs)}</td></tr>
                <tr><td style="color:var(--fg-muted);vertical-align:top">Explicit options</td><td class="mono">${exp.l}</td><td class="mono">${exp.r}</td></tr>
                <tr><td style="color:var(--fg-muted);vertical-align:top">Effective options</td><td class="mono">${eff.l}</td><td class="mono">${eff.r}</td></tr>
              </tbody>
            </table>`;
        }

        return `
          <div class="view-head">
            <div style="min-width:0;flex:1">
              <h1 class="view-title" style="display:flex;align-items:center;gap:9px;min-width:0" title="${esc(`${inv.cmd} ${fullPatternStr}`)}">
                <span class="dot ${dot}" style="width:8px;height:8px"></span>
                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(inv.cmd)} ${esc(fullPatternStr)}</span>
              </h1>
              <div class="view-meta mono">
                <span>${esc(inv.wsLabel)}</span>
                ${inv.source === "cli" || inv.toolTag === "cli" ? `<span>·</span><span>CLI</span>` : ""}
                <span>·</span><span>${esc(inv.time)}</span>
                ${inv.outcome !== "running" ? `<span>·</span><span>${fmtMs(inv.durationMs)}</span>` : ""}
              </div>
            </div>
            <div class="view-actions">${headerRight}</div>
          </div>
          <div class="text-tabs" role="tablist" style="border-bottom:1px solid var(--line);margin-bottom:18px">
            <button class="text-tab" role="tab" aria-selected="${state.invTab === "all"}" onclick="state.invTab='all';renderMain()">All</button>
            <button class="text-tab" role="tab" aria-selected="${state.invTab === "targets"}" onclick="state.invTab='targets';renderMain()">Targets</button>
            <button class="text-tab" role="tab" aria-selected="${state.invTab === "details"}" onclick="state.invTab='details';renderMain()">Details</button>
            <button class="text-tab" role="tab" aria-selected="${state.invTab === "logs"}" onclick="state.invTab='logs';renderMain()">Logs</button>
            <button class="text-tab" role="tab" aria-selected="${state.invTab === "timing"}" onclick="state.invTab='timing';renderMain()">Timing</button>
            <button class="text-tab" role="tab" aria-selected="${state.invTab === "compare"}" onclick="state.invTab='compare';renderMain()">Compare</button>
          </div>
          ${body}`;
      }

      // Analytics: Faithful to current src/lib/AnalyticsView.svelte with tidied dark slate visuals
      function renderAnalytics() {
        const ds = ANALYTICS_DATA.all;
        const days = ds.days.map((d) => ({
          ...d,
          count: d.ok + d.failed + d.interrupted,
          totalMs: (d.ok + d.failed + d.interrupted) * d.p50,
          wsMain: Math.max(1, Math.round((d.ok + d.failed) * 0.7)),
          wsOther: Math.max(
            0,
            d.ok + d.failed + d.interrupted - Math.max(1, Math.round((d.ok + d.failed) * 0.7)),
          ),
        }));
        const maxCount = Math.max(1, ...days.map((d) => d.count));
        const maxTotal = Math.max(1, ...days.map((d) => d.totalMs));
        const maxP95 = Math.max(1, ...days.map((d) => d.p95));
        const step = 540 / Math.max(1, days.length);
        const pts = (key) =>
          days
            .map((d, i) => `${56 + i * step + step / 2},${150 - (d[key] / maxP95) * 124}`)
            .join(" ");
        const patterns = ds.patterns.filter(
          (p) =>
            !state.analyticsPattern ||
            p.pattern.toLowerCase().includes(state.analyticsPattern.toLowerCase()),
        );

        return `
          <div class="view-head">
            <div><h1 class="view-title sans">Analytics</h1></div>
            <button class="btn" onclick="toast('Analytics refreshed')">Refresh</button>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)">
            <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg-dim)">Start date<input class="input mono" id="an-start" type="date" value="${esc(state.analyticsDateStart)}" style="width:136px" /></label>
            <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg-dim)">End date<input class="input mono" id="an-end" type="date" value="${esc(state.analyticsDateEnd)}" style="width:136px" /></label>
            <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg-dim)">Workspace
              <select class="input mono" id="an-ws" style="width:165px">
                <option value="">All workspaces</option>
                ${WORKSPACES.filter((w) => w.tier !== "orphan")
                  .map(
                    (w) =>
                      `<option value="${w.id}" ${state.analyticsWs === w.id ? "selected" : ""}>${esc(w.path)}</option>`,
                  )
                  .join("")}
              </select>
            </label>
            <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg-dim)">Command<input class="input mono" id="an-cmd" placeholder="All commands" value="${esc(state.analyticsCmd)}" style="width:112px" /></label>
            <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg-dim)">Result
              <select class="input" id="an-outcome" style="width:108px">
                <option value="">All</option>
                ${["ok", "failed", "interrupted", "unknown"].map((o) => `<option value="${o}" ${state.analyticsOutcome === o ? "selected" : ""}>${o}</option>`).join("")}
              </select>
            </label>
            <label style="display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg-dim)">Target patterns<input class="input mono" id="an-pat" placeholder="//app:server" value="${esc(state.analyticsPattern)}" style="width:160px" /></label>
          </div>

          <section class="section">
            <div class="section-head">
              <div><h2 class="section-title">Invocations</h2><div style="font-size:11.5px;color:var(--fg-dim);margin-top:2px">${esc(state.analyticsDateStart)} to ${esc(state.analyticsDateEnd)} · Invocations without a recorded start time are excluded.</div></div>
              <label style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fg-dim)">Breakdown
                <select class="input" id="an-breakdown" style="width:110px">
                  <option value="result" ${state.analyticsBreakdown === "result" ? "selected" : ""}>Result</option>
                  <option value="workspace" ${state.analyticsBreakdown === "workspace" ? "selected" : ""}>Workspace</option>
                </select>
              </label>
            </div>
            <svg viewBox="0 0 620 176" style="display:block;width:100%;max-width:680px;height:176px">
              <line x1="48" y1="20" x2="48" y2="150" stroke="var(--line-strong)" />
              <line x1="48" y1="150" x2="604" y2="150" stroke="var(--line-strong)" />
              <text x="6" y="28" fill="var(--fg-dim)" font-size="10" font-family="var(--mono)">${maxCount}</text>
              <text x="30" y="150" fill="var(--fg-dim)" font-size="10" font-family="var(--mono)">0</text>
              ${days
                .map((d, i) => {
                  const x = 58 + i * step,
                    bw = Math.max(12, step - 20);
                  if (state.analyticsBreakdown === "result") {
                    const hOk = (d.ok / maxCount) * 124,
                      hFail = (d.failed / maxCount) * 124,
                      hInt = (d.interrupted / maxCount) * 124;
                    return `<g><title>${d.day}: ${d.count} (ok ${d.ok}, failed ${d.failed}, interrupted ${d.interrupted})</title>
                    <rect x="${x}" y="${150 - hOk}" width="${bw}" height="${hOk}" fill="var(--ok)" opacity="0.72" />
                    <rect x="${x}" y="${150 - hOk - hFail}" width="${bw}" height="${hFail}" fill="var(--err)" opacity="0.85" />
                    <rect x="${x}" y="${150 - hOk - hFail - hInt}" width="${bw}" height="${hInt}" fill="var(--warn)" opacity="0.85" />
                    <text x="${x + bw / 2}" y="166" text-anchor="middle" fill="var(--fg-dim)" font-size="10" font-family="var(--mono)">${esc(d.label)}</text>
                  </g>`;
                  }
                  const h1 = (d.wsMain / maxCount) * 124,
                    h2 = (d.wsOther / maxCount) * 124;
                  return `<g><title>${d.day}: ${d.count}</title>
                  <rect x="${x}" y="${150 - h1}" width="${bw}" height="${h1}" fill="var(--primary)" opacity="0.78" />
                  <rect x="${x}" y="${150 - h1 - h2}" width="${bw}" height="${h2}" fill="#7f93a8" opacity="0.78" />
                  <text x="${x + bw / 2}" y="166" text-anchor="middle" fill="var(--fg-dim)" font-size="10" font-family="var(--mono)">${esc(d.label)}</text>
                </g>`;
                })
                .join("")}
            </svg>
            <div class="legend">
              ${
                state.analyticsBreakdown === "result"
                  ? `<span class="legend-item"><i class="sw" style="background:var(--ok)"></i>ok</span><span class="legend-item"><i class="sw" style="background:var(--err)"></i>failed</span><span class="legend-item"><i class="sw" style="background:var(--warn)"></i>interrupted</span><span class="legend-item"><i class="sw" style="background:var(--fg-dim)"></i>unknown</span>`
                  : `<span class="legend-item"><i class="sw" style="background:var(--primary)"></i>/demo/cool-mono</span><span class="legend-item"><i class="sw" style="background:#7f93a8"></i>/tmp/wt/cool-mono-2</span>`
              }
            </div>
          </section>

          <section class="section">
            <div class="section-head"><div><h2 class="section-title">Total duration</h2><div style="font-size:11.5px;color:var(--fg-dim);margin-top:2px">Total duration per day</div></div></div>
            <svg viewBox="0 0 620 176" style="display:block;width:100%;max-width:680px;height:176px">
              <line x1="48" y1="20" x2="48" y2="150" stroke="var(--line-strong)" />
              <line x1="48" y1="150" x2="604" y2="150" stroke="var(--line-strong)" />
              <text x="4" y="28" fill="var(--fg-dim)" font-size="10" font-family="var(--mono)">${fmtMs(maxTotal)}</text>
              <text x="30" y="150" fill="var(--fg-dim)" font-size="10" font-family="var(--mono)">0</text>
              ${days
                .map((d, i) => {
                  const x = 58 + i * step,
                    bw = Math.max(12, step - 20),
                    h = (d.totalMs / maxTotal) * 124;
                  return `<g><title>${d.day}: ${fmtMs(d.totalMs)}</title><rect x="${x}" y="${150 - h}" width="${bw}" height="${h}" fill="#3a5264" /><text x="${x + bw / 2}" y="166" text-anchor="middle" fill="var(--fg-dim)" font-size="10" font-family="var(--mono)">${esc(d.label)}</text></g>`;
                })
                .join("")}
            </svg>
          </section>

          <section class="section">
            <div class="section-head"><div><h2 class="section-title">Duration</h2><div style="font-size:11.5px;color:var(--fg-dim);margin-top:2px">Per-day invocation duration percentiles</div></div></div>
            <svg viewBox="0 0 620 176" style="display:block;width:100%;max-width:680px;height:176px">
              <line x1="48" y1="20" x2="48" y2="150" stroke="var(--line-strong)" />
              <line x1="48" y1="150" x2="604" y2="150" stroke="var(--line-strong)" />
              <text x="4" y="28" fill="var(--fg-dim)" font-size="10" font-family="var(--mono)">${fmtMs(maxP95)}</text>
              <text x="30" y="150" fill="var(--fg-dim)" font-size="10" font-family="var(--mono)">0</text>
              <polyline fill="none" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="4 3" points="${pts("p95")}" />
              <polyline fill="none" stroke="var(--primary)" stroke-width="2" points="${pts("p50")}" />
              ${days
                .map((d, i) => {
                  const cx = 56 + i * step + step / 2;
                  return `<g><circle cx="${cx}" cy="${150 - (d.p95 / maxP95) * 124}" r="2.5" fill="var(--warn)"><title>${d.day}: p95 ${fmtMs(d.p95)}</title></circle><circle cx="${cx}" cy="${150 - (d.p50 / maxP95) * 124}" r="2.5" fill="var(--primary)"><title>${d.day}: p50 ${fmtMs(d.p50)}</title></circle><text x="${cx}" y="166" text-anchor="middle" fill="var(--fg-dim)" font-size="10" font-family="var(--mono)">${esc(d.label)}</text></g>`;
                })
                .join("")}
            </svg>
            <div class="legend">
              <span class="legend-item"><i class="sw" style="background:var(--primary)"></i>p50</span>
              <span class="legend-item"><i class="sw" style="background:var(--warn)"></i>p95</span>
            </div>
          </section>

          <section class="section">
            <div class="section-head"><div><h2 class="section-title">Target patterns</h2><div style="font-size:11.5px;color:var(--fg-dim);margin-top:2px">Complete pattern lists by total duration</div></div></div>
            <table class="lens-table">
              <thead><tr><th>Target patterns</th><th style="text-align:right">Invocations</th><th style="text-align:right">Total</th><th style="text-align:right">p50</th><th style="text-align:right">p95</th></tr></thead>
              <tbody>${patterns.map((p) => `<tr class="clickable ${state.analyticsPattern === p.pattern ? "selected" : ""}" onclick="state.analyticsPattern=state.analyticsPattern==='${esc(p.pattern)}'?'':'${esc(p.pattern)}';renderMain()"><td class="mono">${esc(p.pattern)}</td><td class="mono" style="text-align:right;color:var(--fg-muted)">${p.count}</td><td class="mono" style="text-align:right;color:var(--fg-muted)">${fmtMs(p.count * p.p50)}</td><td class="mono" style="text-align:right;color:var(--fg-muted)">${fmtMs(p.p50)}</td><td class="mono" style="text-align:right;color:var(--fg-muted)">${fmtMs(p.p95)}</td></tr>`).join("")}</tbody>
            </table>
          </section>`;
      }

      // =====================================================================
      // UNIFIED RIGHT INSPECTOR (with ← Back stack!)
      // =====================================================================
      function inspectorHeader(title, subHtml, actionsHtml, accentTitle = false) {
        return `<div class="inspector-head">
          <div class="inspector-title-row">
            <h2 class="inspector-title" style="${accentTitle ? "color:var(--primary)" : ""}" title="${esc(title)}">${esc(title)}</h2>
            <button class="ghost-btn" style="padding:0 5px" onclick="state.inspector=null;render()">✕</button>
          </div>
          ${subHtml ? `<div class="inspector-sub mono">${subHtml}</div>` : ""}
          ${actionsHtml ? `<div class="inspector-actions">${actionsHtml}</div>` : ""}
        </div>`;
      }

      function renderInspector() {
        const el = $("#inspector");
        if (!state.inspector) {
          el.classList.add("hidden");
          return;
        }
        el.classList.remove("hidden");
        const ins = state.inspector;

        if (ins.kind === "target") {
          const t = TARGET_MAP.get(ins.id);
          if (!t) {
            el.classList.add("hidden");
            return;
          }
          const act = primaryCmd(t);
          const menu = [
            ...(act.cmd !== "build"
              ? [{ label: "Build", onclick: `runBazel('build', '${t.label}')` }]
              : []),
            {
              label: "Run with flags…",
              meta: "⌘R",
              onclick: `openRunModal('${act.cmd}', '${t.label}')`,
            },
            "---",
            {
              label: "Used by (rdeps)",
              onclick: `openQueryInMode('query', 'rdeps(//..., ${t.label})')`,
            },
            {
              label: "Affected tests",
              onclick: `openQueryInMode('query', 'kind(&quot;.*_test&quot;, rdeps(//..., ${t.label}))')`,
            },
            {
              label: "Path from //app:server",
              onclick: `openQueryInMode('query', 'somepath(//app:server, ${t.label})')`,
            },
          ];
          let body = "";
          if (ins.tab === "definition") {
            body = `<dl class="kv">
              <dt>location</dt><dd class="mono" style="color:var(--fg-muted)">${esc(t.loc)}</dd>
              ${t.generator ? `<dt>generator</dt><dd class="mono">${esc(t.generator)}</dd>` : ""}
              <dt>visibility</dt><dd class="mono" style="color:var(--fg-muted)">${esc(t.visibility.join(", "))}</dd>
              <dt>tags</dt><dd class="mono" style="color:var(--fg-muted)">${t.tags.length ? esc(t.tags.join(", ")) : "—"}</dd>
              <dt>srcs (${t.srcs.length})</dt><dd class="kv-list mono" style="color:var(--fg-muted)">${t.srcs.map((f) => `<span>${esc(f.replace(t.pkg + "/", ""))}</span>`).join("")}</dd>
              <dt>deps (${t.deps.length})</dt><dd class="kv-list mono">${t.deps.map((d) => `<button class="link" style="${TARGET_MAP.has(d) ? "" : "color:var(--fg-dim)"}" onclick="inspectTarget('${d}')">${esc(d)}</button>`).join("") || "—"}</dd>
              <dt>data (${t.data.length})</dt><dd class="kv-list mono">${t.data.map((d) => `<button class="link" onclick="inspectTarget('${d}')">${esc(d)}</button>`).join("") || "—"}</dd>
              <dt>query</dt><dd style="display:flex;gap:12px;flex-wrap:wrap"><button class="link link-accent mono" onclick="openQueryInMode('query', 'rdeps(//..., ${t.label})')">rdeps</button><button class="link link-accent mono" onclick="openQueryInMode('query', 'kind(&quot;.*_test&quot;, rdeps(//..., ${t.label}))')">affected tests</button><button class="link link-accent mono" onclick="openQueryInMode('query', 'somepath(//app:server, ${t.label})')">somepath</button></dd>
            </dl>`;
          } else if (ins.tab === "configured") {
            // Single-target cquery: ONLY target config (no fake exec transition!), honest query-vs-cquery select()
            const isOpt = state.inspectorFlags.includes("opt");
            const mode = isOpt ? "opt" : "fastbuild",
              hash = isOpt ? "7c2a91e" : "4a8f12c";
            const match = getConfiguredTargets(state.inspectorFlags).find(
              (c) => c.label === t.label && !c.isExec,
            );
            const c = match || {
              config: `${PLAT}-${mode}`,
              hash,
              providers: ["DefaultInfo"],
              resolvedAttrs: [],
              outputs: [`bazel-out/${PLAT}-${mode}/bin/${t.pkg}/${t.name}`],
            };
            body = `
              <div style="display:flex;gap:6px;margin-bottom:12px">
                <input class="input mono" id="ins-flags" value="${esc(state.inspectorFlags)}" placeholder="Build flags, e.g. --config=opt" />
                <button class="btn" onclick="state.inspectorFlags=document.getElementById('ins-flags').value;renderInspector()">Apply</button>
              </div>
              <dl class="kv">
                <dt>config</dt><dd class="mono">${esc(c.config)} (${esc(c.hash)})</dd>
                <dt>providers</dt><dd class="mono" style="color:var(--fg-muted)">${esc(c.providers.join(", "))}</dd>
                <dt>outputs</dt><dd class="kv-list mono" style="color:var(--fg-muted)">${c.outputs.map((o) => `<span>${esc(shortPath(o))}</span>`).join("")}</dd>
                ${c.resolvedAttrs.map((a) => `<dt>${esc(a.attr)}</dt><dd class="mono"><div style="color:var(--fg-dim);font-size:11px">BUILD: ${esc(a.queryDef)}</div><div style="margin-top:2px">Resolved: ${esc(a.resolved)}</div></dd>`).join("")}
              </dl>`;
          } else {
            const acts = getActions(state.inspectorFlags).filter((a) => a.owner === t.label);
            body = `
              <div style="display:flex;gap:6px;margin-bottom:12px">
                <input class="input mono" id="ins-flags" value="${esc(state.inspectorFlags)}" placeholder="Build flags, e.g. --config=opt" />
                <button class="btn" onclick="state.inspectorFlags=document.getElementById('ins-flags').value;renderInspector()">Apply</button>
              </div>
              ${acts.length ? acts.map((a) => `<details class="flat-detail"><summary><span class="mono" style="min-width:70px;font-weight:500">${esc(a.mnemonic)}</span><span class="mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg-muted)">${esc(shortPath(a.output))}</span></summary><div class="detail-body"><pre class="code-box" style="cursor:pointer" onclick="copyActionById('${a.id}')">${esc(a.args.join(" "))}</pre></div></details>`).join("") : `<div style="color:var(--fg-dim);font-size:12px">No actions for ${esc(t.label)} in fixture.</div>`}`;
          }
          el.innerHTML = `${inspectorHeader(t.label, `<span>${esc(t.ruleClass)}</span>`, actionPair(act.cmd, act.label, t.label))}
            <div class="inspector-tabs"><div class="text-tabs">
              <button class="text-tab ${ins.tab === "definition" ? "active" : ""}" onclick="state.inspector.tab='definition';renderInspector()">Definition</button>
              <button class="text-tab ${ins.tab === "configured" ? "active" : ""}" onclick="state.inspector.tab='configured';renderInspector()">Configured</button>
              <button class="text-tab ${ins.tab === "actions" ? "active" : ""}" onclick="state.inspector.tab='actions';renderInspector()">Actions</button>
            </div></div>
            <div class="inspector-body">${body}</div>`;
          const fl = $("#ins-flags");
          if (fl)
            fl.addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                state.inspectorFlags = e.target.value;
                renderInspector();
              }
            });
          return;
        }

        if (ins.kind === "configured") {
          const c = getConfiguredTargets(state.queryBuildFlags).find((x) => x.id === ins.id);
          if (!c) {
            el.classList.add("hidden");
            return;
          }
          el.innerHTML = `${inspectorHeader(c.label, `<span>${esc(c.config)} (${esc(c.hash)})</span>`, `<button class="btn" onclick="openQueryInMode('aquery', '${c.label}', state.queryBuildFlags)">Inspect in aquery</button><button class="ghost-btn" onclick="inspectTarget('${c.label}', true)">Definition</button>`)}
            <div class="inspector-body"><dl class="kv">
              <dt>is_exec</dt><dd class="mono">${c.isExec ? "true (tool)" : "false (target)"}</dd>
              ${c.transition ? `<dt>transition</dt><dd class="mono">${esc(c.transition)}</dd>` : ""}
              <dt>providers</dt><dd class="mono" style="color:var(--fg-muted)">${esc(c.providers.join(", "))}</dd>
              ${c.resolvedAttrs.map((a) => `<dt>${esc(a.attr)}</dt><dd class="mono"><div style="color:var(--fg-dim);font-size:11px">BUILD: ${esc(a.queryDef)}</div><div style="margin-top:2px">Resolved: ${esc(a.resolved)}</div></dd>`).join("")}
            </dl></div>`;
          return;
        }

        if (ins.kind === "action") {
          const a = getActions(
            state.nav === "query" ? state.queryBuildFlags : state.inspectorFlags,
          ).find((x) => x.id === ins.id);
          if (!a) {
            el.classList.add("hidden");
            return;
          }
          const body =
            ins.tab === "command"
              ? `<pre class="code-box" style="margin-bottom:14px;cursor:pointer" onclick="copyActionById('${a.id}')" title="Click to copy">${esc(a.args.join(" "))}</pre>
               <dl class="kv">
                 <dt>owner</dt><dd><button class="link link-accent mono" onclick="inspectTarget('${a.owner}', true)">${esc(a.owner)} ↗</button></dd>
                 <dt>config</dt><dd class="mono">${esc(a.config.mnemonic)} (${esc(a.config.checksum)})${a.config.isTool ? " · tool" : ""}</dd>
                 <dt>platform</dt><dd class="mono" style="color:var(--fg-muted)">${esc(a.execPlatform)}</dd>
                 ${a.env?.length ? `<dt>env</dt><dd class="kv-list mono" style="color:var(--fg-muted)">${a.env.map((e) => `<span>${esc(e.k)}=${esc(e.v)}</span>`).join("")}</dd>` : ""}
               </dl>`
              : `<div class="kv-list mono" style="font-size:11.5px;gap:5px">${(ins.tab === "inputs" ? a.inputs : a.outputs).map((p) => (ins.tab === "inputs" && p.startsWith("bazel-out/") ? `<button class="link link-accent" onclick="traceArtifactProducer('${p}')">${esc(p)} ↗</button>` : `<span style="color:var(--fg-muted)">${esc(p)}</span>`)).join("")}</div>`;
          el.innerHTML = `${inspectorHeader(a.mnemonic, `<span>${esc(a.owner)}</span><span>·</span><span>${esc(a.config.mnemonic)}</span>`, `<button class="btn btn-primary" onclick="copyActionById('${a.id}')">Copy command</button>`)}
            <div class="inspector-tabs"><div class="text-tabs">
              <button class="text-tab ${ins.tab === "command" ? "active" : ""}" onclick="state.inspector.tab='command';renderInspector()">Command</button>
              <button class="text-tab ${ins.tab === "inputs" ? "active" : ""}" onclick="state.inspector.tab='inputs';renderInspector()">Inputs (${a.inputs.length})</button>
              <button class="text-tab ${ins.tab === "outputs" ? "active" : ""}" onclick="state.inspector.tab='outputs';renderInspector()">Outputs (${a.outputs.length})</button>
            </div></div>
            <div class="inspector-body">${body}</div>`;
          return;
        }

        if (ins.kind === "config") {
          const c = BAZELRC_CONFIGS.find((x) => x.name === ins.id);
          if (!c) {
            el.classList.add("hidden");
            return;
          }
          const tab = ins.tab || "provenance";
          const prov = c.provenance || [];
          const body =
            tab === "provenance"
              ? `<div style="font-size:11px;color:var(--fg-dim);margin-bottom:10px">Resolved via <span class="mono">--announce_rc</span> / BEP <span class="mono">OptionsParsed</span> (last flag wins).</div>
               <dl class="kv">
                 <dt>inherits</dt><dd class="mono">${c.inherits.length ? c.inherits.map((x) => `--config=${x}`).join(", ") : "—"}</dd>
                 ${prov.map((p) => `<dt>${p.overriddenBy ? `<span style="color:var(--warn)">overridden</span>` : "active"}</dt><dd class="mono"><div class="${p.overriddenBy ? "flag-overridden" : ""}">${esc(p.flag)}</div><div style="font-size:11px;color:var(--fg-dim);margin-top:1px">${esc(p.source)}${p.overriddenBy ? ` → <span style="color:var(--warn)">${esc(p.overriddenBy)}</span>` : ""}</div></dd>`).join("")}
               </dl>`
              : `<dl class="kv"><dt>inherits</dt><dd class="mono">${c.inherits.length ? c.inherits.map((x) => `--config=${x}`).join(", ") : "—"}</dd><dt>canonical</dt><dd class="kv-list mono" style="color:var(--fg-muted)">${c.canonical.map((f) => `<span>${esc(f)}</span>`).join("")}</dd></dl>`;
          el.innerHTML = `${inspectorHeader(`--config=${c.name}`, `<span>${esc(c.source)}</span>`, `<button class="btn" onclick="openRunModal('build', '//app:server', '--config=${c.name}')">Run with config</button><button class="ghost-btn" onclick="openQueryInMode('cquery', 'deps(//app:server, 2)', '--config=${c.name}')">Open in cquery</button>`, true)}
            <div class="inspector-tabs"><div class="text-tabs">
              <button class="text-tab ${tab === "provenance" ? "active" : ""}" onclick="state.inspector.tab='provenance';renderInspector()">Provenance (--announce_rc)</button>
              <button class="text-tab ${tab === "canonical" ? "active" : ""}" onclick="state.inspector.tab='canonical';renderInspector()">Canonical</button>
            </div></div>
            <div class="inspector-body">${body}</div>`;
          return;
        }

        if (ins.kind === "module") {
          const m = MODULES.find((x) => x.id === ins.id);
          if (!m) {
            el.classList.add("hidden");
            return;
          }
          const repoAlternation = m.repos
            .map((r) => r.canonical.slice(2).replace(/\+/g, "\\\\+"))
            .join("|");
          const modQuery =
            m.repos.length > 1
              ? `filter("^@@(${repoAlternation})//", deps(//...))`
              : `filter("^@@${repoAlternation}//", deps(//...))`;
          const body =
            ins.tab === "explain"
              ? `<dl class="kv"><dt>declared</dt><dd><button class="link link-accent mono" onclick="toast('Opened ${esc(m.loc)}')">${esc(m.loc)} ↗</button></dd><dt>mvs</dt><dd class="kv-list mono">${m.mvsReason.map((r) => `<div>${esc(r.by)} <span style="color:var(--primary)">${esc(r.requested)}</span> <span style="color:var(--fg-dim)">· ${esc(r.note)}</span></div>`).join("")}</dd></dl>`
              : `<table class="lens-table"><thead><tr><th>Apparent</th><th>Canonical</th><th>Kind</th></tr></thead><tbody>${m.repos.map((r) => `<tr class="clickable" onclick="copyText('${esc(r.path)}', 'Copied external/ path')"><td class="mono">${esc(r.apparent)}</td><td class="mono" style="color:var(--fg-muted)">${esc(r.canonical)}</td><td class="mono" style="color:var(--fg-dim);font-size:11px">${esc(r.kind)}</td></tr>`).join("")}</tbody></table>`;
          el.innerHTML = `${inspectorHeader(`${m.name}@${m.version}`, `<span>${esc(m.depth)}</span><span>·</span><span>${m.repos.length} repo${m.repos.length > 1 ? "s" : ""}</span>`, `<button class="btn" onclick="openQueryInMode('query', '${esc(modQuery)}')">Targets using module</button>`)}
            <div class="inspector-tabs"><div class="text-tabs">
              <button class="text-tab ${ins.tab === "explain" ? "active" : ""}" onclick="state.inspector.tab='explain';renderInspector()">Explain (MVS)</button>
              <button class="text-tab ${ins.tab === "repos" ? "active" : ""}" onclick="state.inspector.tab='repos';renderInspector()">Repos (${m.repos.length})</button>
            </div></div>
            <div class="inspector-body">${body}</div>`;
          return;
        }

        if (ins.kind === "testlog") {
          const tl = TEST_LOGS[ins.id] || {
            logPath: `bazel-testlogs/${ins.id.slice(2).replace(":", "/")}/test.log`,
            cases: [],
            raw: "No test.log recorded.",
          };
          el.innerHTML = `${inspectorHeader(ins.id, `<span>${esc(tl.logPath)}</span>`, `<button class="btn" onclick="runBazel('test', '${ins.id}')">Re-run</button>`)}
            <div class="inspector-body"><pre class="code-box">${esc(tl.raw)}</pre></div>`;
          return;
        }

        if (ins.kind === "event") {
          const inv = INVOCATIONS.find((i) => i.id === state.selectedInvId);
          let sp = null;
          for (const l of inv?.lanes || []) {
            const f = l.spans.find((s) => s.id === ins.id);
            if (f) {
              sp = f;
              break;
            }
          }
          if (!sp) {
            el.classList.add("hidden");
            return;
          }
          const cta =
            sp.kind === "analysis"
              ? `<button class="btn btn-primary" onclick="openQueryInMode('cquery', '${esc(sp.target)}', '${esc(inv.explicitFlags.join(" "))}')">Open in cquery</button>`
              : `<button class="btn btn-primary" onclick="openQueryInMode('aquery', 'mnemonic(&quot;${esc(sp.mnemonic)}&quot;, ${esc(sp.target)})', '${esc(inv.explicitFlags.join(" "))}')">Open in aquery</button>`;
          el.innerHTML = `${inspectorHeader(sp.mnemonic, `<span>${sp.kind === "analysis" ? "Analysis event" : "Execution action"}</span>`, cta)}
            <div class="inspector-body"><dl class="kv"><dt>event</dt><dd class="mono">${esc(sp.name)}</dd><dt>duration</dt><dd class="mono">${fmtMs(sp.endMs - sp.startMs)}</dd><dt>target</dt><dd><button class="link link-accent mono" onclick="inspectTarget('${sp.target}', true)">${esc(sp.target)} ↗</button></dd></dl></div>`;
        }
      }

      function renderMain() {
        const el = $("#main");
        const centered = (html) => `<div class="page-center">${html}</div>`;
        if (state.nav === "workspace") el.innerHTML = centered(renderWorkspace());
        else if (state.nav === "explorer") el.innerHTML = renderExplorer();
        else if (state.nav === "modules") el.innerHTML = centered(renderModules());
        else if (state.nav === "query") el.innerHTML = centered(renderQuery());
        else if (state.nav === "invocations") el.innerHTML = renderInvocation();
        else el.innerHTML = centered(renderAnalytics());

        const bindFocusInput = (id, setter) => {
          const inp = document.getElementById(id);
          if (!inp) return;
          inp.addEventListener("input", (e) => {
            setter(e.target.value);
            renderMain();
            const el2 = document.getElementById(id);
            if (el2) {
              el2.focus();
              el2.setSelectionRange(el2.value.length, el2.value.length);
            }
          });
        };
        bindFocusInput("mod-search", (v) => (state.modSearch = v));
        bindFocusInput("aq-filter", (v) => (state.aqueryFilter = v));
        bindFocusInput("inv-res-search", (v) => (state.invResultSearch = v));
        bindFocusInput("an-cmd", (v) => (state.analyticsCmd = v));
        bindFocusInput("an-pat", (v) => (state.analyticsPattern = v));

        const bindChange = (id, setter) => {
          const x = document.getElementById(id);
          if (x)
            x.addEventListener("change", (e) => {
              setter(e.target.value);
              renderMain();
            });
        };
        bindChange("an-start", (v) => (state.analyticsDateStart = v));
        bindChange("an-end", (v) => (state.analyticsDateEnd = v));
        bindChange("an-ws", (v) => (state.analyticsWs = v));
        bindChange("an-outcome", (v) => (state.analyticsOutcome = v));
        bindChange("an-breakdown", (v) => (state.analyticsBreakdown = v));

        const cmp = $("#compare-select");
        if (cmp)
          cmp.addEventListener("change", (e) => {
            state.compareRightId = e.target.value;
            renderMain();
          });
        const aqm = $("#aq-mnemonic");
        if (aqm)
          aqm.addEventListener("change", (e) => {
            state.aqueryMnemonic = e.target.value;
            renderMain();
          });
        const qf = $("#q-build-flags");
        if (qf) {
          qf.addEventListener("input", (e) => {
            state.queryBuildFlags = e.target.value;
            state.queryStale = true;
            const el2 = $("#query-cmd-text");
            if (el2) el2.textContent = `$ ${currentQueryCommand()}`;
            const st = $("#query-stale-note");
            if (st) st.style.display = "inline";
          });
          qf.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              state.queryStale = false;
              renderMain();
            }
          });
        }
        const qc = $("#q-code-input");
        if (qc)
          qc.addEventListener("input", (e) => {
            state.queryExpr = e.target.value;
            state.queryCodeError = null;
            state.queryStale = true;
            const el2 = $("#query-cmd-text");
            if (el2) el2.textContent = `$ ${currentQueryCommand()}`;
            const st = $("#query-stale-note");
            if (st) st.style.display = "inline";
          });
      }

      function render() {
        renderTop();
        renderRail();
        renderSidebar();
        renderMain();
        renderInspector();
      }

      // =====================================================================
      // ⌘K COMMAND PALETTE (Grouped + Filtered + ↑↓ Enter Keyboard Nav)
      // =====================================================================
      function renderPalette(q = "") {
        const s = q.trim().toLowerCase();
        const groups = [
          {
            title: "Commands",
            items: [
              {
                title: "Run Bazel command…",
                meta: "⌘⇧R",
                run: () => openRunModal("build", "//..."),
              },
            ].filter((x) => !s || x.title.toLowerCase().includes(s) || "run bazel".includes(s)),
          },
          {
            title: "Targets",
            items: TARGETS.filter(
              (t) => !s || t.label.toLowerCase().includes(s) || t.ruleClass.includes(s),
            )
              .slice(0, 5)
              .map((t) => ({
                title: t.label,
                meta: t.ruleClass,
                run: () => inspectTarget(t.label, true),
              })),
          },
          {
            title: "Invocations",
            items: INVOCATIONS.filter(
              (i) =>
                !s ||
                `${i.id} ${i.cmd} ${i.patterns.join(" ")} ${i.wsLabel}`.toLowerCase().includes(s),
            )
              .slice(0, 4)
              .map((i) => ({
                title: `${i.cmd} ${patternSummary(i)}`,
                meta: `${i.id} · ${i.outcome}`,
                run: () => openInvocation(i.id),
              })),
          },
        ].filter((g) => g.items.length > 0);

        const flat = [];
        const html = groups
          .map(
            (g) =>
              `<div class="popover-group">${esc(g.title)}</div>` +
              g.items
                .map((it) => {
                  const idx = flat.length;
                  flat.push(it);
                  return `<button class="menu-item ${idx === state.paletteIdx ? "kb-active" : ""}" data-p="${idx}"><span class="mono">${esc(it.title)}</span><span class="meta">${esc(it.meta)}</span></button>`;
                })
                .join(""),
          )
          .join("");

        state.paletteItems = flat;
        if (state.paletteIdx >= flat.length) state.paletteIdx = 0;
        const box = $("#palette-results");
        box.innerHTML =
          html || `<div style="padding:12px;color:var(--fg-dim);font-size:12px">No matches</div>`;
        box.querySelectorAll("[data-p]").forEach((b) =>
          b.addEventListener("click", () => {
            closeDialog("palette-dialog");
            flat[Number(b.dataset.p)].run();
          }),
        );
      }

      const SCENARIO_LIST = [
        {
          title: "1. Workspace Overview (bazel info & output_base)",
          desc: "Consistent darwin_arm64 paths, OS RSS, safe confirmation on Shutdown/Expunge",
          run: () => {
            state.nav = "workspace";
            state.wsTab = "overview";
            state.inspector = null;
            render();
          },
        },
        {
          title: "2. Explorer & 3-Layer Target Inspector (with ← Back)",
          desc: "Hierarchical packages, Definition / Configured / Actions + Back navigation",
          run: () => {
            state.nav = "explorer";
            state.selectedDir = "app/lib";
            state.inspectorHistory = [];
            state.inspector = { kind: "target", id: "//app/lib:parser", tab: "definition" };
            render();
          },
        },
        {
          title: "3. Modules (1:N Bzlmod Repos & MVS)",
          desc: "rules_jvm_external owning both module repo and @maven extension repo",
          run: () => {
            state.nav = "modules";
            state.inspector = { kind: "module", id: "rules_jvm_external", tab: "repos" };
            render();
          },
        },
        {
          title: "4. Query — Bidirectional AST Builder ⇄ Code (query/cquery/aquery)",
          desc: "Full kind selector, Examples, --transitions=lite, Duplicates only, Mnemonic filter + Env",
          run: () => openQueryInMode("query"),
        },
        {
          title: "5. Invocations — Multi-Pattern, DAG Timeline & Inline Stacktrace",
          desc: "All tab (Targets + Timeline + Log), Re-run, parallel test worker",
          run: () => openInvocation("inv-multi-test", "all"),
        },
        {
          title: "6. Analytics — Current Implementation (Tidied)",
          desc: "Date/Workspace/Command/Result/Pattern filters, Invocations/Total/Duration charts, Patterns table",
          run: () => {
            state.nav = "analytics";
            render();
          },
        },
      ];

      $("#scenarios-btn").addEventListener("click", () => {
        const list = $("#scenarios-list");
        list.innerHTML = SCENARIO_LIST.map(
          (sc, i) =>
            `<button class="inv-item" data-sc="${i}"><div style="font-weight:600;font-size:12.5px">${esc(sc.title)}</div><div style="font-size:11.5px;color:var(--fg-muted)">${esc(sc.desc)}</div></button>`,
        ).join("");
        list.querySelectorAll("[data-sc]").forEach((b) =>
          b.addEventListener("click", () => {
            closeDialog("scenarios-dialog");
            SCENARIO_LIST[Number(b.dataset.sc)].run();
          }),
        );
        openDialog("scenarios-dialog");
      });
      document.querySelectorAll(".rail-btn[data-nav]").forEach((b) =>
        b.addEventListener("click", () => {
          state.nav = b.dataset.nav;
          state.inspector = null;
          state.inspectorHistory = [];
          render();
        }),
      );
      $("#palette-btn").addEventListener("click", () => {
        $("#palette-input").value = "";
        state.paletteIdx = 0;
        renderPalette("");
        openDialog("palette-dialog");
        $("#palette-input").focus();
      });
      $("#palette-input").addEventListener("input", (e) => {
        state.paletteIdx = 0;
        renderPalette(e.target.value);
      });
      $("#palette-input").addEventListener("keydown", (e) => {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          state.paletteIdx = (state.paletteIdx + 1) % Math.max(1, state.paletteItems.length);
          renderPalette(e.target.value);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          state.paletteIdx =
            (state.paletteIdx - 1 + state.paletteItems.length) %
            Math.max(1, state.paletteItems.length);
          renderPalette(e.target.value);
        } else if (e.key === "Enter" && state.paletteItems[state.paletteIdx]) {
          e.preventDefault();
          closeDialog("palette-dialog");
          state.paletteItems[state.paletteIdx].run();
        }
      });
      window.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          $("#palette-input").value = "";
          state.paletteIdx = 0;
          renderPalette("");
          openDialog("palette-dialog");
          $("#palette-input").focus();
        } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "o") {
          e.preventDefault();
          openWorkspacePrompt();
        } else if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "r") {
          e.preventDefault();
          openRunModal("build", state.inspector?.kind === "target" ? state.inspector.id : "//...");
        } else if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && state.nav === "query") {
          e.preventDefault();
          state.queryStale = false;
          renderMain();
          toast(`Executed bazel ${state.queryMode}`);
        }
      });
      $("#run-cmd").addEventListener("change", updateRunPreview);
      $("#run-target").addEventListener("input", updateRunPreview);
      $("#run-flags").addEventListener("input", updateRunPreview);
      $("#run-form").addEventListener("submit", (e) => {
        e.preventDefault();
        closeDialog("run-dialog");
        runBazel(
          $("#run-cmd").value,
          $("#run-target").value.trim() || "//...",
          $("#run-flags").value.trim(),
        );
      });

      render();
    </script>
  </body>
</html>
