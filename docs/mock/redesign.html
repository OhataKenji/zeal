<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zeal — Bazel Lens Prototype</title>
    <style>
      :root {
        --font-sans: "Avenir Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "SF Mono", "Menlo", "Consolas", monospace;

        /* 90% Quiet Dark Slate */
        --rail: #11181f;
        --sidebar: #151d25;
        --main: #182129;
        --inspector: #151e26;
        --inset: #10171f;
        --hover: rgba(255, 255, 255, 0.045);
        --selected: rgba(131, 191, 209, 0.11);

        --line: rgba(255, 255, 255, 0.07);
        --line-strong: rgba(255, 255, 255, 0.14);

        --fg: #e2e9ef;
        --fg-muted: #8c9fae;
        --fg-dim: #627585;

        /* 8% Primary */
        --primary: #83bfd1;
        --primary-fg: #0e1a22;
        --primary-hover: #9bd0e0;

        /* 2% Semantic */
        --ok: #72cda0;
        --err: #f3979b;
        --err-tint: rgba(243, 151, 155, 0.055);
        --warn: #e3b765;
        --warn-tint: rgba(227, 183, 101, 0.055);

        --radius: 5px;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--main);
        color: var(--fg);
        font: 13px/1.5 var(--font-sans);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
        opacity: 0.4;
      }
      :where(button, input, select, textarea, summary, [tabindex]):focus-visible {
        outline: 1.5px solid var(--primary);
        outline-offset: -1.5px;
      }
      code,
      pre,
      .mono {
        font-family: var(--mono);
      }

      .app {
        display: grid;
        grid-template-rows: 40px minmax(0, 1fr);
        height: 100vh;
        width: 100vw;
      }

      /* Topbar: 3 Minimal Elements */
      .topbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        background: var(--rail);
        border-bottom: 1px solid var(--line);
        position: relative;
        z-index: 30;
      }
      .ws-trigger {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 26px;
        padding: 0 8px 0 6px;
        border: none;
        border-radius: var(--radius);
        background: transparent;
        font-size: 12.5px;
      }
      .ws-trigger:hover {
        background: var(--hover);
      }
      .logo-mark {
        width: 15px;
        height: 15px;
        border-radius: 3px;
        flex-shrink: 0;
        background: linear-gradient(
          135deg,
          #34d399 0%,
          #34d399 47%,
          #11181f 47%,
          #11181f 55%,
          #0891b2 55%
        );
      }
      .search-bar {
        flex: 1;
        max-width: 400px;
        margin: 0 auto;
        height: 26px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.02);
        color: var(--fg-dim);
        font-size: 12px;
        text-align: left;
      }
      .search-bar:hover {
        border-color: var(--line-strong);
        color: var(--fg-muted);
      }
      .search-bar .kbd {
        margin-left: auto;
        font: 10.5px var(--mono);
        color: var(--fg-dim);
      }
      .topbar-right {
        min-width: 120px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
      }

      /* Native <details> Dropdowns (Zero JS click-bubbling bugs!) */
      details.dd {
        position: relative;
        display: inline-flex;
      }
      details.dd > summary {
        list-style: none;
        cursor: pointer;
      }
      details.dd > summary::-webkit-details-marker {
        display: none;
      }
      .dd-menu {
        position: absolute;
        top: calc(100% + 5px);
        left: 0;
        min-width: 240px;
        padding: 5px;
        border-radius: 7px;
        border: 1px solid var(--line-strong);
        background: var(--sidebar);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
        z-index: 60;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .dd-menu.right {
        left: auto;
        right: 0;
      }
      .dd-menu.compact {
        min-width: 176px;
      }
      .inspector-actions .dd-menu.right {
        left: 0;
        right: auto;
      }
      .action-pair {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .page-center {
        max-width: 1080px;
        margin: 0 auto;
        width: 100%;
      }
      .popover-group {
        padding: 6px 8px 3px;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--fg-dim);
      }
      .popover-sep {
        height: 1px;
        background: var(--line);
        margin: 4px 0;
      }
      .menu-item {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border: none;
        border-radius: 4px;
        background: transparent;
        text-align: left;
        font-size: 12px;
        color: var(--fg);
        white-space: nowrap;
      }
      .menu-item:hover,
      .menu-item.kb-active {
        background: var(--hover);
      }
      .menu-item.active {
        background: var(--selected);
        color: var(--primary);
      }
      .menu-item.danger {
        color: var(--err);
      }
      .menu-item .meta {
        margin-left: auto;
        font: 11px var(--mono);
        color: var(--fg-dim);
      }

      /* Split Button (1 Context = 1 Split Button) */
      .split-btn {
        position: relative;
        display: inline-flex;
        align-items: stretch;
      }
      .split-main {
        height: 26px;
        padding: 0 10px;
        border: 1px solid var(--primary);
        border-right: none;
        border-radius: var(--radius) 0 0 var(--radius);
        background: var(--primary);
        color: var(--primary-fg);
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .split-main:hover {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
      }
      .split-caret {
        height: 26px;
        width: 22px;
        border: 1px solid var(--primary);
        border-left: 1px solid rgba(14, 26, 34, 0.22);
        border-radius: 0 var(--radius) var(--radius) 0;
        background: var(--primary);
        color: var(--primary-fg);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
      }
      .split-caret:hover {
        background: var(--primary-hover);
      }

      .ghost-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 26px;
        padding: 0 8px;
        border: none;
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg-muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .ghost-btn:hover {
        background: var(--hover);
        color: var(--fg);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        height: 26px;
        padding: 0 10px;
        border-radius: var(--radius);
        border: 1px solid var(--line-strong);
        background: transparent;
        color: var(--fg);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        background: var(--hover);
      }
      .btn-primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-fg);
        font-weight: 600;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
      }
      .btn-danger {
        border-color: var(--err);
        color: var(--err);
      }
      .btn-danger:hover:not(:disabled) {
        background: var(--err-tint);
      }

      /* Dots */
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--fg-dim);
      }
      .dot-ok {
        background: var(--ok);
      }
      .dot-err {
        background: var(--err);
      }
      .dot-warn {
        background: var(--warn);
      }
      .dot-run {
        background: var(--primary);
        box-shadow: 0 0 0 3px rgba(131, 191, 209, 0.25);
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      /* Workspace 4-slot grid */
      .workspace {
        display: grid;
        grid-template-columns: 60px auto minmax(0, 1fr) auto;
        min-height: 0;
        overflow: hidden;
      }

      /* Left Rail (60px: Icon + Quiet 1-word label = externalized memory, zero clutter) */
      .rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 4px;
        background: var(--rail);
        border-right: 1px solid var(--line);
      }
      .rail-btn {
        position: relative;
        width: 52px;
        padding: 6px 2px 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border: none;
        border-radius: var(--radius);
        background: transparent;
        color: var(--fg-dim);
      }
      .rail-btn span.rail-lbl {
        font-size: 9.5px;
        line-height: 1;
        letter-spacing: 0.01em;
      }
      .rail-btn:hover {
        color: var(--fg);
        background: var(--hover);
      }
      .rail-btn.active {
        color: var(--fg);
      }
      .rail-btn.active::before {
        content: "";
        position: absolute;
        left: -4px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--primary);
      }
      .rail-dot {
        position: absolute;
        top: 6px;
        right: 11px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--err);
      }
      .rail-spacer {
        flex: 1;
      }

      /* Sidebar */
      .sidebar {
        width: 242px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--sidebar);
        border-right: 1px solid var(--line);
      }
      .sidebar.hidden {
        display: none;
      }
      .sidebar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--fg-dim);
      }
      .sidebar-controls {
        padding: 0 12px 8px;
        border-bottom: 1px solid var(--line);
      }
      .sidebar-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px;
      }

      .input {
        width: 100%;
        height: 26px;
        padding: 0 8px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--inset);
        color: var(--fg);
        font-size: 12px;
      }
      .input:focus {
        border-color: var(--primary);
        outline: none;
      }

      .nav-row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 8px;
        border: none;
        border-radius: var(--radius);
        background: transparent;
        text-align: left;
        font-size: 12.5px;
        color: var(--fg-muted);
      }
      .nav-row:hover {
        background: var(--hover);
        color: var(--fg);
      }
      .nav-row.selected {
        background: var(--selected);
        color: var(--fg);
        font-weight: 500;
      }
      .nav-row .count {
        margin-left: auto;
        font: 11px var(--mono);
        color: var(--fg-dim);
      }
      .twisty {
        width: 12px;
        color: var(--fg-dim);
        font-size: 10px;
        display: inline-flex;
        justify-content: center;
      }

      .inv-item {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 7px 8px;
        margin-bottom: 1px;
        border: none;
        border-radius: var(--radius);
        background: transparent;
        text-align: left;
      }
      .inv-item:hover {
        background: var(--hover);
      }
      .inv-item.selected {
        background: var(--selected);
      }
      .inv-item-top {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }
      .inv-item-label {
        font: 12px var(--mono);
        color: var(--fg);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .inv-item-dur {
        font: 11px var(--mono);
        color: var(--fg-muted);
      }
      .inv-item-sub {
        display: flex;
        align-items: center;
        gap: 5px;
        padding-left: 13px;
        font-size: 11px;
        color: var(--fg-dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Primary Underline Tabs (Top-level view tabs ONLY) */
      .text-tabs {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .text-tab {
        padding: 4px 0;
        border: none;
        border-bottom: 1.5px solid transparent;
        background: transparent;
        font-size: 12px;
        color: var(--fg-dim);
      }
      .text-tab:hover {
        color: var(--fg-muted);
      }
      .text-tab.active,
      .text-tab[aria-selected="true"] {
        color: var(--fg);
        border-bottom-color: var(--primary);
        font-weight: 500;
      }

      /* Subordinate Switch (Distinct from primary underline tabs — solves 3-tier tab clash!) */
      .sub-switch {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 2px;
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.035);
      }
      .sub-switch button {
        border: none;
        background: transparent;
        padding: 2px 8px;
        border-radius: 3px;
        font-size: 11.5px;
        color: var(--fg-dim);
      }
      .sub-switch button:hover {
        color: var(--fg-muted);
      }
      .sub-switch button.active {
        background: var(--hover);
        color: var(--fg);
        font-weight: 500;
      }

      /* Main Canvas */
      .main {
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        padding: 20px 28px 40px;
      }
      .view-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 18px;
      }
      .view-title {
        margin: 0;
        font: 600 17px/1.3 var(--mono);
        letter-spacing: -0.015em;
      }
      .view-title.sans {
        font-family: var(--font-sans);
      }
      .view-meta {
        margin-top: 3px;
        font-size: 11.5px;
        color: var(--fg-muted);
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .view-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section {
        margin-bottom: 26px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      .section-title {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--fg-dim);
      }

      /* High-Density Table */
      table.lens-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      table.lens-table th {
        text-align: left;
        font-size: 11px;
        font-weight: 600;
        color: var(--fg-dim);
        padding: 6px 8px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      table.lens-table td {
        padding: 7px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      table.lens-table tbody tr.clickable:hover {
        background: var(--hover);
        cursor: pointer;
      }
      table.lens-table tbody tr.selected {
        background: var(--selected);
      }

      .link {
        background: none;
        border: none;
        padding: 0;
        color: var(--fg);
        text-align: left;
      }
      .link:hover {
        color: var(--primary);
        text-decoration: underline;
      }
      .link-accent {
        color: var(--primary);
      }

      /* Right Detail Pane: Wide Responsive Pane */
      .inspector {
        width: clamp(520px, 50vw, 960px);
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--inspector);
        border-left: 1px solid var(--line);
      }
      .cache-bar {
        display: flex;
        height: 6px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.06);
        margin: 6px 0 8px;
      }
      .inspector.hidden {
        display: none;
      }
      .inspector-head {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
      }
      .inspector-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .inspector-title {
        margin: 0;
        font: 600 14px/1.3 var(--mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .inspector-sub {
        margin-top: 3px;
        font-size: 11.5px;
        color: var(--fg-muted);
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }
      .inspector-actions {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .inspector-tabs {
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }
      .inspector-body {
        flex: 1;
        overflow-y: auto;
        padding: 14px 16px 28px;
      }

      .kv {
        display: grid;
        grid-template-columns: 98px minmax(0, 1fr);
        margin: 0;
        font-size: 12px;
      }
      .kv dt {
        color: var(--fg-dim);
        padding: 8px 10px 8px 0;
        border-bottom: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 11px;
      }
      .kv dd {
        margin: 0;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        min-width: 0;
        word-break: break-word;
      }
      .kv-list {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      /* Callouts (NO nested box-in-box inside callouts!) */
      .callout {
        padding: 9px 13px;
        border-left: 2px solid var(--line-strong);
        background: rgba(255, 255, 255, 0.02);
        margin-bottom: 16px;
        font-size: 12px;
      }
      .callout-err {
        border-left-color: var(--err);
        background: var(--err-tint);
      }
      .callout-warn {
        border-left-color: var(--warn);
        background: var(--warn-tint);
      }
      .callout.clickable {
        cursor: pointer;
      }
      .callout.clickable:hover {
        filter: brightness(1.1);
      }
      .callout pre {
        margin: 0;
        font: 11.5px/1.55 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .code-box {
        margin: 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--inset);
        font: 11.5px/1.6 var(--mono);
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }

      /* Query Composer */
      .query-composer {
        padding-bottom: 14px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }
      .composer-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      .ast-node {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .ast-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ast-children {
        margin-left: 8px;
        padding-left: 14px;
        border-left: 1px solid var(--line-strong);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .ast-arg-label {
        width: 64px;
        flex-shrink: 0;
        font: 11px var(--mono);
        color: var(--fg-dim);
      }
      .ast-select {
        height: 26px;
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--inset);
        font: 12px var(--mono);
        color: var(--fg);
      }
      .cmd-preview {
        margin-top: 9px;
        display: flex;
        align-items: center;
        gap: 8px;
        font: 11.5px var(--mono);
        color: var(--fg-dim);
      }
      .cmd-preview button {
        border: none;
        background: none;
        padding: 0;
        color: var(--fg-dim);
        text-align: left;
      }
      .cmd-preview button:hover {
        color: var(--fg-muted);
      }

      /* Graph */
      .graph-canvas {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--inset);
        padding: 14px;
        overflow: auto;
      }
      .g-node {
        cursor: pointer;
        transition: opacity 0.12s ease;
      }
      .g-node rect {
        fill: var(--sidebar);
        stroke: var(--line-strong);
        stroke-width: 1.2;
        rx: 4;
      }
      .g-node:hover rect,
      .g-node.selected rect {
        stroke: var(--primary);
        fill: var(--selected);
      }
      .g-node text {
        fill: var(--fg);
        font: 11px var(--mono);
      }
      .g-node.dimmed,
      .g-edge.dimmed {
        opacity: 0.18;
      }
      .g-edge {
        transition: opacity 0.12s ease;
      }

      /* Timeline with Time Axis Ruler */
      .timeline-canvas {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--inset);
        overflow: hidden;
      }
      .tl-row {
        display: grid;
        grid-template-columns: 148px minmax(0, 1fr);
        border-bottom: 1px solid var(--line);
        min-height: 27px;
        align-items: center;
      }
      .tl-row:last-child {
        border-bottom: none;
      }
      .tl-ruler {
        min-height: 22px;
        background: rgba(255, 255, 255, 0.015);
      }
      .tl-ruler-ticks {
        display: flex;
        justify-content: space-between;
        padding: 0 6px;
        font: 10px var(--mono);
        color: var(--fg-dim);
      }
      .tl-label {
        padding: 4px 10px;
        font: 11px var(--mono);
        color: var(--fg-muted);
        border-right: 1px solid var(--line);
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .tl-track {
        position: relative;
        height: 27px;
        background: repeating-linear-gradient(
          90deg,
          transparent,
          transparent 19.9%,
          rgba(255, 255, 255, 0.03) 20%
        );
      }
      .tl-bar {
        position: absolute;
        top: 4px;
        height: 18px;
        border-radius: 2px;
        background: #304250;
        border: 1px solid rgba(255, 255, 255, 0.12);
        padding: 0 5px;
        font: 500 10.5px/16px var(--mono);
        color: var(--fg);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        text-align: left;
      }
      .tl-bar.phase {
        top: 8px;
        height: 10px;
        background: #2b3e4c;
        border-color: rgba(131, 191, 209, 0.25);
        pointer-events: none;
      }
      .tl-bar.phase-exec {
        background: rgba(131, 191, 209, 0.38);
      }
      .tl-bar.selected {
        background: var(--primary);
        color: var(--primary-fg);
        border-color: var(--primary);
        font-weight: 600;
      }
      .tl-bar.failed {
        background: rgba(243, 151, 155, 0.28);
        border-color: var(--err);
        color: var(--err);
      }

      .flag-overridden {
        text-decoration: line-through;
        color: var(--fg-dim);
      }

      .diff-add {
        color: var(--ok);
      }
      .diff-del {
        color: var(--err);
      }

      /* Analytics */
      .metric-strip {
        display: flex;
        align-items: baseline;
        gap: 32px;
        padding: 6px 0 14px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 22px;
        flex-wrap: wrap;
      }
      .metric-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .metric-val {
        font: 600 18px/1.2 var(--mono);
      }
      .metric-lbl {
        font-size: 11px;
        color: var(--fg-dim);
      }
      .legend {
        display: flex;
        gap: 14px;
        font-size: 11px;
        color: var(--fg-dim);
        margin-top: 8px;
        align-items: center;
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .sw {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        display: inline-block;
      }

      .bars {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 112px;
        padding-top: 8px;
      }
      .bar-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        height: 100%;
        justify-content: flex-end;
        background: none;
        border: none;
        padding: 0;
      }
      .bar-stack {
        width: 100%;
        max-width: 24px;
        display: flex;
        flex-direction: column-reverse;
        border-radius: 2px 2px 0 0;
        overflow: hidden;
        outline: 1.5px solid transparent;
      }
      .bar-col:hover .bar-stack,
      .bar-col.active .bar-stack {
        outline-color: var(--primary);
      }
      .bar-date {
        font: 10.5px var(--mono);
        color: var(--fg-dim);
      }
      .bar-col.active .bar-date {
        color: var(--primary);
      }

      details.flat-detail {
        border-bottom: 1px solid var(--line);
      }
      details.flat-detail summary {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        cursor: pointer;
        list-style: none;
        font-size: 12px;
      }
      details.flat-detail summary::-webkit-details-marker {
        display: none;
      }
      details.flat-detail .detail-body {
        padding: 0 0 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .cols-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
      }
      @media (max-width: 960px) {
        .cols-2 {
          grid-template-columns: 1fr;
        }
        .inspector {
          width: 350px;
        }
      }

      /* Dialogs (Flush borderless input for ⌘K Palette!) */
      dialog.modal {
        width: min(540px, 92vw);
        padding: 0;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--sidebar);
        color: var(--fg);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      }
      dialog.modal::backdrop {
        background: rgba(6, 10, 14, 0.65);
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
        font-size: 13px;
      }
      .palette-input {
        width: 100%;
        height: 42px;
        padding: 0 14px;
        border: none;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        font-size: 13.5px;
        outline: none;
      }
      .modal-body {
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 68vh;
        overflow-y: auto;
      }

      .toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        padding: 8px 12px;
        border-radius: var(--radius);
        background: var(--rail);
        border: 1px solid var(--line-strong);
        color: var(--fg);
        font-size: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        opacity: 0;
        pointer-events: none;
        transform: translateY(4px);
        transition:
          opacity 0.14s ease,
          transform 0.14s ease;
        z-index: 100;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>

      function serializeAst(node) {
        if (!node) return "//...";
        if (node.kind === "target") return node.text || "//...";
        if (node.kind === "binary")
          return `(${serializeAst(node.left)} ${node.op} ${serializeAst(node.right)})`;

            : `deps(${serializeAst(a.expr)})`;
        if (node.fn === "rdeps")

        if (node.fn === "somepath")
          return `somepath(${serializeAst(a.from)}, ${serializeAst(a.to)})`;
        if (node.fn === "buildfiles") return `buildfiles(${serializeAst(a.expr)})`;
        if (node.fn === "config") return `config(${serializeAst(a.expr)}, ${a.config || "target"})`;
        return `${node.fn}("${a.pattern || ""}", ${serializeAst(a.expr)})`;

      // Lightweight bidirectional parser so Code -> Builder actually syncs!
      function splitTopArgs(str) {
        const out = [];
        let depth = 0,
          quote = null,
          cur = "";
        for (let i = 0; i < str.length; i++) {
          const ch = str[i];
          if (quote) {
            cur += ch;
            if (ch === quote && str[i - 1] !== "\\") quote = null;
            continue;
          }
          if (ch === '"' || ch === "'") {
            quote = ch;
            cur += ch;
            continue;
          }
          if (ch === "(") depth++;
          else if (ch === ")") depth--;
          if (ch === "," && depth === 0) {
            out.push(cur.trim());
            cur = "";
            continue;
          }
          cur += ch;
        }
        if (cur.trim()) out.push(cur.trim());
        return out;
      }
      function unquote(s) {
        const t = s.trim();
        if ((t.startsWith('"') && t.endsWith('"')) || (t.startsWith("'") && t.endsWith("'")))
          return t.slice(1, -1);
        return t;
      }
      function parseQueryToAst(raw) {
        const s = (raw || "").trim();
        if (!s) return null;
        if (s.startsWith("(") && s.endsWith(")")) {
          const inner = s.slice(1, -1).trim();
          for (const op of [" intersect ", " union ", " except "]) {
            let depth = 0,
              idx = -1;
            for (let i = 0; i < inner.length; i++) {
              if (inner[i] === "(") depth++;
              else if (inner[i] === ")") depth--;
              else if (depth === 0 && inner.slice(i, i + op.length) === op) {
                idx = i;
                break;
              }
            }
            if (idx > 0) {
              const l = parseQueryToAst(inner.slice(0, idx));
              const r = parseQueryToAst(inner.slice(idx + op.length));
              if (l && r) return { kind: "binary", op: op.trim(), left: l, right: r };
            }
          }
        }
        const m = s.match(/^([a-z_]+)\(([\s\S]*)\)$/);
        if (m) {
          const fn = m[1],
            args = splitTopArgs(m[2]);
          if (fn === "deps" && args.length >= 1)
            return {
              kind: "call",
              fn,
              args: {
                expr: parseQueryToAst(args[0]) || { kind: "target", text: args[0] },
                depth: args[1] || "",
              },
            };
          if (fn === "rdeps" && args.length >= 2)
            return {
              kind: "call",
              fn,
              args: {
                universe: parseQueryToAst(args[0]) || { kind: "target", text: args[0] },
                expr: parseQueryToAst(args[1]) || { kind: "target", text: args[1] },
              },
            };
          if (fn === "somepath" && args.length >= 2)
            return {
              kind: "call",
              fn,
              args: {
                from: parseQueryToAst(args[0]) || { kind: "target", text: args[0] },
                to: parseQueryToAst(args[1]) || { kind: "target", text: args[1] },
              },
            };
          if (fn === "buildfiles" && args.length >= 1)
            return {
              kind: "call",
              fn,
              args: { expr: parseQueryToAst(args[0]) || { kind: "target", text: args[0] } },
            };
          if (fn === "config" && args.length >= 2)
            return {
              kind: "call",
              fn,
              args: {
                expr: parseQueryToAst(args[0]) || { kind: "target", text: args[0] },
                config: unquote(args[1]),
              },
            };
          if (
            ["kind", "filter", "mnemonic", "inputs", "outputs"].includes(fn) &&
            args.length >= 2
          ) {
            return {
              kind: "call",
              fn,
              args: {
                pattern: unquote(args[0]),
                expr: parseQueryToAst(args[1]) || { kind: "target", text: args[1] },
              },
            };
          }
          return null;
        }
        if (/^[@/:\w.*+-]+$/.test(s)) return { kind: "target", text: s };
        return null;
      }

      document.querySelectorAll("dialog.modal").forEach((d) =>
        d.addEventListener("click", (e) => {
          if (e.target === d) d.close();
        }),
      );

      let pendingConfirm = null;
      function confirmAction(title, desc, btnLabel, onConfirm) {
        $("#confirm-title").textContent = title;
        $("#confirm-desc").innerHTML = desc;
        $("#confirm-ok-btn").textContent = btnLabel;
        pendingConfirm = onConfirm;
        openDialog("confirm-dialog");
      }
      $("#confirm-ok-btn").addEventListener("click", () => {
        closeDialog("confirm-dialog");
        if (pendingConfirm) {
          const fn = pendingConfirm;
          pendingConfirm = null;
          fn();
        }
      });

      // =====================================================================
      // INSPECTOR HISTORY & NAVIGATION
      // =====================================================================
      function pushInspector(next, pushHistory = true) {
        if (
          pushHistory &&
          state.inspector &&
          (state.inspector.kind !== next.kind || state.inspector.id !== next.id)
        ) {
          state.inspectorHistory.push({ ...state.inspector, nav: state.nav });
          if (state.inspectorHistory.length > 20) state.inspectorHistory.shift();
        }
        state.inspector = next;
      }
      window.inspectorBack = () => {
        const prev = state.inspectorHistory.pop();
        if (!prev) return;
        state.nav = prev.nav;
        state.inspector = { kind: prev.kind, id: prev.id, tab: prev.tab };
        render();
      };

      function switchWorkspace(wsId) {
        state.activeWsId = wsId;
        closeAllPopovers();
        const w = activeWs();
        toast(`Switched to ${w.name}`);
        render();
      }
      window.openWorkspacePrompt = () => {
        const p = prompt(
          "Open Bazel workspace path (native folder picker in app):",
          "/Users/dev/src/new-repo",
        );
        if (!p || !p.trim()) return;
        const clean = p.trim().replace(/\/+$/, "");
        const existing = WORKSPACES.find((w) => w.path === clean);
        if (existing) {
          switchWorkspace(existing.id);
          return;
        }
        const name = clean.split("/").pop() || clean;
        const id = `ws-${Date.now()}`;
        WORKSPACES.unshift({
          id,
          name,
          path: clean,
          tier: "pinned",
          server: "stopped",
          pid: null,
          rss: "—",
          outputBaseSize: "—",
          outputBase: `/private/var/tmp/_bazel_dev/${id.slice(-8)}`,
          status: "ok",
        });
        switchWorkspace(id);
      };

      window.simulateDirDeleted = (wsId) => {
        const w = WORKSPACES.find((x) => x.id === wsId);
        if (!w) return;
        w.tier = "orphan";
        w.name = `${w.name} (deleted)`;
        w.server = "stopped";
        w.pid = null;
        w.rss = "—";
        w.status = "orphan";
        if (state.activeWsId === wsId) state.activeWsId = WORKSPACES[0].id;
        toast("Directory deleted — removed from switcher, kept as orphan output_base");
        render();
      };

      function inspectTarget(label, switchToExplorer = false) {
        if (!TARGET_MAP.has(label)) {
          const mod = MODULES.find((m) =>
            m.repos.some((r) => label.startsWith(r.canonical) || label.startsWith(r.apparent)),
          );
          if (mod) {
            if (state.inspector)
              state.inspectorHistory.push({ ...state.inspector, nav: state.nav });
            state.nav = "modules";
            state.inspector = { kind: "module", id: mod.id, tab: "explain" };
            render();
            return;
          }
          openQueryInMode("query", `deps(${label}, 1)`);
          return;
        }
        if (switchToExplorer) {
          state.nav = "explorer";
          state.selectedDir = TARGET_MAP.get(label).pkg;
          const parts = state.selectedDir.split("/");
          if (parts.length > 1) state.expandedDirs.add(parts[0]);
        }
        pushInspector({ kind: "target", id: label, tab: "definition" });
        render();
      }

      function openQueryInMode(mode, expr, buildFlags) {
        state.nav = "query";
        state.queryMode = mode;
        state.queryResultView = "table";
        state.queryCodeError = null;
        state.queryStale = false;
        if (buildFlags !== undefined) state.queryBuildFlags = buildFlags;
        if (expr) {
          state.queryExpr = expr;
          const parsed = parseQueryToAst(expr);
          if (parsed) {
            state.queryAst = parsed;
            state.queryEditMode = "builder";
          } else {
            state.queryEditMode = "code";
          }
        } else {
          const ex = QUERY_EXAMPLES[mode][0];
          state.queryAst = JSON.parse(JSON.stringify(ex.ast));
          state.queryExpr = serializeAst(state.queryAst);
          state.queryEditMode = "builder";
        }
        state.inspector = null;
        render();
      }

      function setQueryEditMode(next) {
        if (next === state.queryEditMode) return;
        if (next === "code") {
          state.queryExpr = serializeAst(state.queryAst);
          state.queryCodeError = null;
          state.queryEditMode = "code";
        } else {
          const parsed = parseQueryToAst(state.queryExpr);
          if (!parsed) {
            state.queryCodeError =
              "Expression cannot be represented in Builder (e.g. set/let or custom syntax). Stay in Code or revert.";
            renderMain();
            return;
          }
          state.queryAst = parsed;
          state.queryCodeError = null;
          state.queryEditMode = "builder";
        }
        renderMain();
      }
      window.setQueryEditMode = setQueryEditMode;
      window.revertToBuilder = () => {
        state.queryExpr = serializeAst(state.queryAst);
        state.queryCodeError = null;
        state.queryEditMode = "builder";
        renderMain();
      };

      function openInvocation(id, tab = "all") {
        state.nav = "invocations";
        state.selectedInvId = id;
        state.invTab = tab;
        state.invResultTab = "issues";
        state.invResultSearch = "";
        const inv = INVOCATIONS.find((i) => i.id === id);
        const key = (x) => (x.patterns || []).join(" ");
        const prev = INVOCATIONS.find((i) => i.id !== id && key(i) === key(inv));
        state.compareRightId =
          prev?.id || INVOCATIONS.find((i) => i.id !== id && i.outcome !== "running")?.id || id;
        state.inspector = null;
        render();
      }

      function openRunModal(cmd, target, flags = "") {
        $("#run-cmd").value = cmd;
        $("#run-target").value = target;
        $("#run-flags").value = flags;
        updateRunPreview();
        openDialog("run-dialog");
      }
      function updateRunPreview() {
        $("#run-preview").textContent = formatBazelCli(
          $("#run-cmd").value,
          $("#run-target").value.trim() || "//...",
          $("#run-flags").value,
        );
      }

      function runBazel(cmd, patternStr, flagsStr = "", targetWsId = state.activeWsId) {
        const ws = WORKSPACES.find((w) => w.id === targetWsId) || activeWs();
        const patterns = patternStr.trim().split(/\s+/).filter(Boolean);
        const id = `inv-live-${Math.floor(Math.random() * 900 + 100)}`;
        const live = {
          id,
          wsId: ws.id,
          wsLabel: ws.name,
          toolTag: "zeal",
          ownedByZeal: true,
          cmd,
          patterns,
          outcome: "running",
          exitCode: null,
          day: "2026-11-19",
          time: "Running…",
          durationMs: 0,
          analysisCacheDiscarded: null,
          startupOptions: ["--max_idle_secs=10800"],
          explicitFlags: flagsStr ? flagsStr.split(/\s+/) : [],
          effectiveFlags: ["--color=yes", ...(flagsStr ? flagsStr.split(/\s+/) : []), "--jobs=8"],
          targetTotalCount: 0,
          targets: [],
          tests: [],
          profileStatus: "missing",
          phases: [],
          lanes: [],
          log: `[${ws.name}] ${formatBazelCli(cmd, patterns, flagsStr)}`,
        };
        INVOCATIONS.unshift(live);
        renderTop();
        toast(`Started in ${ws.name}: ${formatBazelCli(cmd, patterns, flagsStr)}`);
        setTimeout(() => {
          live.outcome = "ok";
          live.exitCode = 0;
          live.time = "Just now";
          live.durationMs = 1720;
          live.ownedByZeal = false;
          live.targetTotalCount = patterns.filter((p) => !p.startsWith("-")).length;
          live.targets = patterns
            .filter((p) => !p.startsWith("-"))
            .map((p) => ({ label: p, ok: true, config: `${PLAT}-fastbuild` }));
          live.tests =
            cmd === "test"
              ? patterns
                  .filter((p) => !p.startsWith("-"))
                  .map((l) => ({ label: l, status: "PASSED" }))
              : [];
          live.profileStatus = "ok";
          live.phases = [
            { name: "Loading", startMs: 80, endMs: 320 },
            { name: "Analysis", startMs: 250, endMs: 700 },
            { name: "Execution", startMs: 610, endMs: 1720, exec: true },
          ];
          live.lanes = [
            {
              name: "critical-path",
              tid: 0,
              spans: [
                {
                  id: `${id}-1`,
                  name: `${cmd === "test" ? "TestRunner" : "Javac"} ${patterns[0]}`,
                  startMs: 650,
                  endMs: 1680,
                  target: patterns[0],
                  mnemonic: cmd === "test" ? "TestRunner" : "Javac",
                  kind: "action",
                },
              ],
            },
          ];
          live.log += `\nINFO: Elapsed time: 1.720s\nINFO: Build completed successfully.`;
          openInvocation(id, "all");
        }, 900);
      }

      window.confirmShutdown = (wsId) => {
        const w = WORKSPACES.find((x) => x.id === wsId);
        if (!w) return;
        confirmAction(
          `Shutdown Bazel server (${w.name})?`,
          `Stops the background JVM (PID ${w.pid || "—"}, RSS ${w.rss}). All build outputs and caches are kept; the next command will cold-start the JVM.`,
          "Shutdown",
          () => {
            w.server = "stopped";
            w.pid = null;
            w.rss = "—";
            toast(`Stopped Bazel server for ${w.name}`);
            render();
          },
        );
      };
      window.confirmExpunge = (wsId) => {
        const idx = WORKSPACES.findIndex((x) => x.id === wsId);
        if (idx < 0) return;
        const w = WORKSPACES[idx];
        confirmAction(
          `Expunge output_base (${w.name})?`,
          `Permanently deletes <code>${esc(w.outputBase)}</code> (<strong>${esc(w.outputBaseSize)}</strong>), including built artifacts and extracted external repos. Rebuilding will take longer (<code>repository_cache</code> is preserved).`,
          "Expunge",
          () => {
            if (w.tier === "orphan") {
              WORKSPACES.splice(idx, 1);
              state.inspector = null;
              toast(`Expunged orphan output_base (${w.outputBaseSize} freed)`);
            } else {
              w.server = "stopped";
              w.pid = null;
              w.rss = "—";
              w.outputBaseSize = "0 MB";
              toast(`Expunged output_base for ${w.name}`);
            }
            render();
          },
        );
      };

      function currentQueryCommand() {
        if (state.queryMode === "query") {
          const out =
            state.queryResultView === "graph"
              ? "--output=graph --nograph:factored"
              : state.queryResultView === "raw"
                ? "--output=label"
                : "--output=label_kind";
          const fl = [
            out,
            state.queryNoImplicit ? "--noimplicit_deps" : "",
            state.queryNoTool ? "--notool_deps" : "",
          ]
            .filter(Boolean)
            .join(" ");
          return `bazel query '${state.queryExpr}' ${fl}`;
        }
        if (state.queryMode === "cquery") {
          const fl = [
            state.queryBuildFlags.trim(),
            state.queryTransitions ? "--transitions=lite" : "",
            state.queryResultView === "raw"
              ? state.queryTransitions
                ? "--output=transitions"
                : "--output=label"
              : "",
          ]
            .filter(Boolean)
            .join(" ");
          return `bazel cquery '${state.queryExpr}'${fl ? " " + fl : ""}`;
        }
        const fl = [
          state.queryBuildFlags.trim(),
          state.queryResultView === "raw" ? "--output=text" : "",
        ]
          .filter(Boolean)
          .join(" ");
        return `bazel aquery '${state.queryExpr}'${fl ? " " + fl : ""}`;
      }
      window.copyCurrentQuery = () => copyText(currentQueryCommand(), "Copied command");
      window.copyActionById = (actId) => {
        const a = getActions(
          state.nav === "query" ? state.queryBuildFlags : state.inspectorFlags,
        ).find((x) => x.id === actId);
        if (a) copyText(a.args.join(" "), "Copied command");
      };
      window.traceArtifactProducer = (p) => {
        const prod = getActions(
          state.nav === "query" ? state.queryBuildFlags : state.inspectorFlags,
        ).find((a) => a.outputs.includes(p));
        if (prod) {
          pushInspector({ kind: "action", id: prod.id, tab: "command" });
          render();
          toast(`Producer: ${prod.mnemonic}`);
        } else toast(`Source artifact: ${p}`);
      };

      // TOPBAR & RAIL
      // =====================================================================
      function renderTop() {
        const ws = activeWs();
        $("#ws-switcher-label").innerHTML = `<strong>${esc(ws.name)}</strong>`;

        const list = WORKSPACES.filter((w) => w.tier !== "orphan");
        const rowHtml = (
          w,
        ) => `<button class="menu-item ${w.id === state.activeWsId ? "active" : ""}" onclick="switchWorkspace('${w.id}')" title="${esc(w.path)}">
            <span>${esc(w.name)}</span>
            <span class="meta">${esc(shortPath(w.path))}</span>
          </button>`;
        $("#ws-switcher-menu").innerHTML =
          `<div class="popover-group">Workspaces</div>${list.map(rowHtml).join("")}` +
          `<div class="popover-sep"></div><button class="menu-item" onclick="closeAllPopovers();openWorkspacePrompt()"><span>Open workspace…</span><span class="meta">⌘O</span></button>`;
      }

      function renderRail() {
        document
          .querySelectorAll(".rail-btn[data-nav]")
          .forEach((b) => b.classList.toggle("active", b.dataset.nav === state.nav));
      }

      // =====================================================================
      // SIDEBAR (Explorer Hierarchical Tree · Invocations Clean 1-row controls)
      // =====================================================================
      function buildDirTree() {
        const root = { path: "", name: "", children: new Map(), totalCount: 0 };
        for (const t of TARGETS) {
          root.totalCount++;
          let cur = root,
            acc = "";
          for (const part of t.pkg.split("/")) {
            acc = acc ? `${acc}/${part}` : part;
            if (!cur.children.has(part))
              cur.children.set(part, { path: acc, name: part, children: new Map(), totalCount: 0 });
            cur = cur.children.get(part);
            cur.totalCount++;
          }
        }
        return root;
      }
      window.selectDir = (path, hasKids) => {
        if (hasKids) {
          if (state.selectedDir === path && state.expandedDirs.has(path))
            state.expandedDirs.delete(path);
          else state.expandedDirs.add(path);
        }
        state.selectedDir = path;
        render();
      };

      function renderSidebar() {
        const sb = $("#sidebar");
        if (state.nav !== "explorer" && state.nav !== "invocations") {
          sb.classList.add("hidden");
          return;
        }
        sb.classList.remove("hidden");

        if (state.nav === "explorer") {
          const tree = buildDirTree();
          let rows = `<button class="nav-row ${state.selectedDir === null ? "selected" : ""}" onclick="state.selectedDir=null;render()"><span class="twisty"></span><span class="mono">//...</span><span class="count">${tree.totalCount}</span></button>`;
          const walk = (node, d) => {
            for (const c of [...node.children.values()].sort((a, b) =>
              a.name.localeCompare(b.name),
            )) {
              const hasKids = c.children.size > 0,
                open = state.expandedDirs.has(c.path);
              rows += `<button class="nav-row ${state.selectedDir === c.path ? "selected" : ""}" style="padding-left:${8 + d * 14}px" onclick="selectDir('${c.path}', ${hasKids})"><span class="twisty">${hasKids ? (open ? "▾" : "▸") : ""}</span><span class="mono">${esc(c.name)}/</span><span class="count">${c.totalCount}</span></button>`;
              if (hasKids && open) walk(c, d + 1);
            }
          };
          walk(tree, 0);
          sb.innerHTML = `<div class="sidebar-head"><span>Packages</span><button class="ghost-btn" style="height:22px;padding:0 4px" onclick="toast('Target index refreshed')" title="Refresh">↻</button></div><div class="sidebar-list">${rows}</div>`;
          return;
        }

        // Invocations Sidebar — Pure path-based scope (This workspace vs All workspaces)
        const ws = activeWs();
        const list = INVOCATIONS.filter((i) => {
          if (state.invScope === "this" && i.wsId !== state.activeWsId) return false;
          if (state.invFilter === "failed") return i.outcome === "failed";
          if (state.invFilter === "running") return i.outcome === "running";
          return true;
        });

        sb.innerHTML = `
          <div class="sidebar-head">
            <span>Invocations</span>
            <button class="ghost-btn" style="height:20px;padding:0 6px;font-size:11px;text-transform:none" onclick="state.invScope=state.invScope==='all'?'this':'all';renderSidebar()">${state.invScope === "all" ? "All paths ▾" : `${esc(ws.name)} ▾`}</button>
          </div>
          <div class="sidebar-controls">
            <div style="display:flex;align-items:center;gap:6px">
              <span style="font-size:11px;color:var(--fg-dim)">Filter</span>
              <div class="sub-switch" style="flex:1">
                <button class="${state.invFilter === "all" ? "active" : ""}" style="flex:1" onclick="state.invFilter='all';renderSidebar()">All</button>
                <button class="${state.invFilter === "failed" ? "active" : ""}" style="flex:1" onclick="state.invFilter='failed';renderSidebar()">Failed</button>
                <button class="${state.invFilter === "running" ? "active" : ""}" style="flex:1" onclick="state.invFilter='running';renderSidebar()">Running</button>
              </div>
            </div>
          </div>
          <div class="sidebar-list">
            ${
              list
                .map((inv) => {
                  const dot =
                    inv.outcome === "running"
                      ? "dot-run"
                      : inv.outcome === "ok"
                        ? "dot-ok"
                        : "dot-err";
                  const metaParts = [inv.time];
                  if (state.invScope === "all" && inv.wsId !== state.activeWsId)
                    metaParts.push(inv.wsLabel);
                  if (inv.source === "cli" || inv.toolTag === "cli") metaParts.push("CLI");
                  return `<button class="inv-item ${state.selectedInvId === inv.id ? "selected" : ""}" onclick="openInvocation('${inv.id}', '${state.invTab}')">
                <div class="inv-item-top"><span class="dot ${dot}"></span><span class="inv-item-label">${esc(inv.cmd)} ${esc(patternSummary(inv))}</span><span class="inv-item-dur">${inv.outcome === "running" ? "…" : fmtMs(inv.durationMs)}</span></div>
                <div class="inv-item-sub mono">${esc(metaParts.join(" · "))}</div>
              </button>`;
                })
                .join("") ||
              `<div style="padding:12px;color:var(--fg-dim);font-size:12px">No invocations.</div>`
            }
          </div>`;
      }

              : state.wsTab === "configs"
                ? `<table class="lens-table">
                    <thead><tr><th>Config</th><th>Source</th><th>Flags</th></tr></thead>
                    <tbody>${BAZELRC_CONFIGS.map((c) => `<tr class="clickable ${state.inspector?.kind === "config" && state.inspector.id === c.name ? "selected" : ""}" onclick="pushInspector({kind:'config',id:'${c.name}',tab:'provenance'}, false);render()"><td class="mono" style="color:var(--primary)">--config=${esc(c.name)}</td><td class="mono" style="color:var(--fg-dim)">${esc(c.source)}</td><td class="mono" style="color:var(--fg-muted)">${esc(c.flags.join(" "))}</td></tr>`).join("")}</tbody>
                  </table>`
                : `<div class="callout callout-warn">Total active Bazel server RSS: <strong>${totalRss} GB</strong> (OS process RSS, no JVM GC lock).</div>
                   <table class="lens-table">
                     <thead><tr><th>Workspace</th><th>Path</th><th>Process RSS · PID</th><th style="text-align:right">output_base</th></tr></thead>
                     <tbody>${WORKSPACES.map((w) => {
                       const dot =
                         w.status === "running"
                           ? "dot-run"
                           : w.status === "failed"
                             ? "dot-err"
                             : w.server === "idle"
                               ? "dot-ok"
                               : "";
                       const sel =
                         state.inspector?.kind === "workspace" && state.inspector.id === w.id;
                       return `<tr class="clickable ${sel ? "selected" : ""}" onclick="pushInspector({kind:'workspace',id:'${w.id}',tab:'info'}, false);render()">
                         <td class="mono" style="color:${w.tier === "orphan" ? "var(--fg-dim)" : "var(--fg)"}"><span class="dot ${dot}" style="margin-right:8px"></span>${esc(w.name)}${w.id === state.activeWsId ? ` <span style="color:var(--primary);font-size:11px">current</span>` : ""}</td>
                         <td class="mono" style="color:var(--fg-dim);font-size:11.5px">${esc(w.path)}</td>
                         <td class="mono" style="color:var(--fg-muted)">${w.pid ? `${esc(w.rss)} · ${w.pid}` : "stopped"}</td>
                         <td class="mono" style="text-align:right;color:var(--fg-dim)">${esc(w.outputBaseSize)}</td>
                       </tr>`;
                     }).join("")}</tbody>
                   </table>`
          }`;
      }

      function actionPair(cmd, label, target) {
        return `<div class="action-pair">
          <button class="btn btn-primary" onclick="runBazel('${cmd}', '${esc(target)}')">${esc(label)}</button>
          <details class="dd">
            <summary class="ghost-btn" aria-label="More actions">⋯</summary>
            <div class="dd-menu right compact">
              ${cmd !== "build" ? `<button class="menu-item" onclick="closeAllPopovers();runBazel('build', '${esc(target)}')">Build</button>` : ""}
              <button class="menu-item" onclick="closeAllPopovers();openRunModal('${cmd}', '${esc(target)}')"><span>Run with flags…</span><span class="meta">⌘⇧R</span></button>
            </div>
          </details>
        </div>`;
      }

      function renderExplorer() {
        const rows = TARGETS.filter(
          (t) =>
            state.selectedDir === null ||
            t.pkg === state.selectedDir ||
            t.pkg.startsWith(state.selectedDir + "/"),
        );
        const hasSub =
          state.selectedDir !== null &&
          TARGETS.some((t) => t.pkg.startsWith(state.selectedDir + "/"));
        const pattern =
          state.selectedDir === null
            ? "//..."
            : hasSub
              ? `//${state.selectedDir}/...`
              : `//${state.selectedDir}:all`;
        const hasTests = rows.some((r) => r.role === "test");
        return `
          <div class="view-head">
            <div><h1 class="view-title">${esc(pattern)}</h1><div class="view-meta"><span>${rows.length} targets</span></div></div>
            <div class="view-actions">${actionPair(hasTests ? "test" : "build", hasTests ? "Test" : "Build", pattern)}</div>
          </div>
          <table class="lens-table">
            <thead><tr><th>Target</th><th>Rule</th></tr></thead>
            <tbody>${rows.map((t) => `<tr class="clickable ${state.inspector?.kind === "target" && state.inspector.id === t.label ? "selected" : ""}" onclick="inspectTarget('${t.label}')"><td class="mono">${esc(state.selectedDir && t.pkg === state.selectedDir ? `:${t.name}` : t.label)}</td><td class="mono" style="color:var(--fg-muted)">${esc(t.ruleClass)}</td></tr>`).join("")}</tbody>
          </table>`;
      }

      function renderModules() {
        const q = state.modSearch.trim().toLowerCase();
        const rows = MODULES.filter(
          (m) =>
            (state.modFilter !== "direct" || m.depth === "direct") &&
            (!q || m.name.includes(q) || m.repos.some((r) => r.apparent.includes(q))),
        );
        return `
          <div class="view-head">
            <div><h1 class="view-title sans">Modules</h1><div class="view-meta mono">MODULE.bazel · ${MODULES.length} modules</div></div>
            <div class="view-actions">
              <div class="sub-switch">
                <button class="${state.modFilter === "all" ? "active" : ""}" onclick="state.modFilter='all';renderMain()">All</button>
                <button class="${state.modFilter === "direct" ? "active" : ""}" onclick="state.modFilter='direct';renderMain()">Direct</button>
              </div>
              <input class="input" id="mod-search" style="width:160px" placeholder="Filter…" value="${esc(state.modSearch)}" />
              <details class="dd">
                <summary class="ghost-btn">⋯</summary>
                <div class="dd-menu right"><button class="menu-item" onclick="closeAllPopovers();toast('bazel fetch //... complete')">Fetch external repos</button></div>
              </details>
            </div>
          </div>
          <table class="lens-table">
            <thead><tr><th>Module</th><th>Selected (MVS)</th><th>Depth</th><th>Repos (1:N)</th></tr></thead>
            <tbody>${rows
              .map(
                (
                  m,
                ) => `<tr class="clickable ${state.inspector?.kind === "module" && state.inspector.id === m.id ? "selected" : ""}" onclick="pushInspector({kind:'module',id:'${m.id}',tab:'explain'}, false);render()">
              <td class="mono">${esc(m.name)}</td>
              <td class="mono">${esc(m.version)}${m.mvsReason.length > 1 ? ` <span style="color:var(--warn);font-size:11px">↑MVS</span>` : ""}</td>
              <td class="mono" style="color:var(--fg-dim)">${esc(m.depth)}</td>
              <td class="mono" style="color:var(--fg-muted)">${m.repos.map((r) => esc(r.apparent)).join(", ")}</td>
            </tr>`,
              )
              .join("")}</tbody>
          </table>`;
      }

      // Recursive AST Builder (with stale tracking)
      function getNodeByPath(root, path) {
        let cur = root;
        for (const k of path) cur = cur[k];
        return cur;
      }
      function setNodeByPath(path, val) {
        if (!path.length) {
          state.queryAst = val;
          return;
        }
        let cur = state.queryAst;
        for (let i = 0; i < path.length - 1; i++) cur = cur[path[i]];
        cur[path[path.length - 1]] = val;
      }
      window.changeAstKind = (pathStr, nextKind) => {
        const path = pathStr ? pathStr.split(".") : [];
        const prev = getNodeByPath(state.queryAst, path);
        const preserved = prev?.kind === "call" ? prev.args?.expr || prev.args?.to : prev;
        setNodeByPath(path, defaultAstNode(nextKind, preserved));
        state.queryExpr = serializeAst(state.queryAst);
        state.queryStale = true;
        renderMain();
      };
      window.editAstLeaf = (pathStr, val) => {
        setNodeByPath(pathStr.split("."), val);
        state.queryExpr = serializeAst(state.queryAst);
        state.queryStale = true;
        const el = $("#query-cmd-text");
        if (el) el.textContent = `$ ${currentQueryCommand()}`;
        const st = $("#query-stale-note");
        if (st) st.style.display = "inline";
      };

      function renderKindSelector(current, pathStr) {
        const fns = QUERY_CATALOG[state.queryMode] || QUERY_CATALOG.query;
        return `<select class="ast-select" onchange="changeAstKind('${pathStr}', this.value)" aria-label="Expression kind">
          <option value="target" ${current === "target" ? "selected" : ""}>target</option>
          <optgroup label="${esc(state.queryMode)} functions">${fns.map((f) => `<option value="${f}" ${current === f ? "selected" : ""}>${f}</option>`).join("")}</optgroup>
          <optgroup label="set operations">${["intersect", "union", "except"].map((op) => `<option value="${op}" ${current === op ? "selected" : ""}>${op}</option>`).join("")}</optgroup>
        </select>`;
      }

      function renderAstBuilder(node, path = []) {
        if (!node) return "";
        const p = path.join(".");
        if (node.kind === "target") {
          return `<div class="ast-row">${renderKindSelector("target", p)}<input class="input mono" style="max-width:280px" value="${esc(node.text || "")}" placeholder="//pkg:target or //..." oninput="editAstLeaf('${p ? p + ".text" : "text"}', this.value)" /></div>`;
        }
        if (node.kind === "binary") {
          return `<div class="ast-node"><div class="ast-row">${renderKindSelector(node.op, p)}</div><div class="ast-children"><div class="ast-row"><span class="ast-arg-label">left:</span><div style="flex:1">${renderAstBuilder(node.left, [...path, "left"])}</div></div><div class="ast-row"><span class="ast-arg-label">right:</span><div style="flex:1">${renderAstBuilder(node.right, [...path, "right"])}</div></div></div></div>`;
        }
        const a = node.args || {},
          hints = {
            universe: "search scope, e.g. //...",
            depth: "optional int",
            pattern: "regex",
            config: "target | null | <hash>",
          };
        return `<div class="ast-node"><div class="ast-row">${renderKindSelector(node.fn, p)}</div><div class="ast-children">
          ${Object.keys(a)
            .map((k) => {
              const v = a[k],
                ap = [...path, "args", k];
              if (v && typeof v === "object")
                return `<div class="ast-row" style="align-items:flex-start"><span class="ast-arg-label" style="padding-top:5px">${esc(k)}:</span><div style="flex:1">${renderAstBuilder(v, ap)}</div></div>`;
              return `<div class="ast-row"><span class="ast-arg-label">${esc(k)}:</span><input class="input mono" style="max-width:240px" value="${esc(v ?? "")}" placeholder="${esc(hints[k] || "")}" oninput="editAstLeaf('${ap.join(".")}', this.value)" /></div>`;
            })
            .join("")}
        </div></div>`;
      }

      window.loadQueryExample = (idx) => {
        const ex = QUERY_EXAMPLES[state.queryMode][idx];
        state.queryAst = JSON.parse(JSON.stringify(ex.ast));
        state.queryExpr = serializeAst(state.queryAst);
        state.queryEditMode = "builder";
        state.queryCodeError = null;
        state.queryStale = false;
        renderMain();
      };

      // Honest Dependency Graph: ONLY draws real edges + dims non-neighborhood nodes on selection!
      function renderHonestGraph(matches) {
        const nodes = matches.slice(0, 6);
        const pos = nodes.map((l, i) => ({
          label: l,
          x: 20 + (i % 3) * 228,
          y: 24 + Math.floor(i / 3) * 76,
        }));
        const posMap = new Map(pos.map((p) => [p.label, p]));
        const edges = [];
        for (const p of pos) {
          const t = TARGET_MAP.get(p.label);
          if (!t) continue;
          for (const d of t.deps) {
            if (posMap.has(d)) edges.push([p, posMap.get(d)]);
          }
        }
        const focus =
          state.inspector?.kind === "target" && posMap.has(state.inspector.id)
            ? state.inspector.id
            : null;
        const neighbors = new Set(focus ? [focus] : []);
        if (focus) {
          edges.forEach(([a, b]) => {
            if (a.label === focus) neighbors.add(b.label);
            if (b.label === focus) neighbors.add(a.label);
          });
        }
        const directRdeps = focus ? TARGETS.filter((t) => t.deps.includes(focus)) : [];
        const affectedTests = focus
          ? TARGETS.filter(
              (t) =>
                t.role === "test" &&
                (t.deps.includes(focus) || directRdeps.some((r) => t.deps.includes(r.label))),
            )
          : [];
        const height = Math.max(100, Math.ceil(nodes.length / 3) * 76 + 34);
        return `
          ${
            focus
              ? `<div class="metric-strip" style="padding:2px 0 10px;margin-bottom:10px">
            <div class="metric-item"><span class="metric-val mono" style="font-size:14px">${directRdeps.length}</span><span class="metric-lbl">Direct rdeps</span></div>
            <div class="metric-item"><span class="metric-val mono" style="font-size:14px">${neighbors.size - 1}</span><span class="metric-lbl">1-hop neighbors shown</span></div>
            <div class="metric-item"><span class="metric-val mono" style="font-size:14px">${affectedTests.length}</span><span class="metric-lbl">Affected tests</span></div>
          </div>`
              : ""
          }
          <div class="graph-canvas"><svg viewBox="0 0 700 ${height}" width="100%" style="max-width:720px;display:block">
            <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#627585"/></marker><marker id="arr-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#83bfd1"/></marker></defs>
            ${pos
              .map((p) => {
                const dim = focus && !neighbors.has(p.label);
                const shortLbl = p.label.length > 26 ? p.label.slice(0, 25) + "…" : p.label;
                return `<g class="g-node ${state.inspector?.id === p.label ? "selected" : ""} ${dim ? "dimmed" : ""}" onclick="inspectTarget('${p.label}')"><title>${esc(p.label)}</title><rect x="${p.x}" y="${p.y}" width="196" height="36"/><text x="${p.x + 10}" y="${p.y + 22}">${esc(shortLbl)}</text></g>`;
              })
              .join("")}
            ${edges
              .map(([a, b]) => {
                const dim = focus && a.label !== focus && b.label !== focus;
                const hi = focus && !dim;
                const ax = a.x + 98,
                  ay = a.y + 18,
                  bx = b.x + 98,
                  by = b.y + 18;
                const dx = bx - ax,
                  dy = by - ay;
                const tA = Math.min(dx ? 98 / Math.abs(dx) : 1e9, dy ? 18 / Math.abs(dy) : 1e9);
                const tB = Math.min(dx ? 100 / Math.abs(dx) : 1e9, dy ? 20 / Math.abs(dy) : 1e9);
                return `<line class="g-edge ${dim ? "dimmed" : ""}" x1="${(ax + dx * tA).toFixed(1)}" y1="${(ay + dy * tA).toFixed(1)}" x2="${(bx - dx * tB).toFixed(1)}" y2="${(by - dy * tB).toFixed(1)}" stroke="${hi ? "#83bfd1" : "#627585"}" stroke-width="1.2" marker-end="url(#${hi ? "arr-hi" : "arr"})"/>`;
              })
              .join("")}
          </svg>${edges.length === 0 ? `<div style="font-size:11px;color:var(--fg-dim);margin-top:6px">No direct dependency edges among matched nodes.</div>` : `<div style="font-size:11px;color:var(--fg-dim);margin-top:6px">${focus ? `Showing 1-hop neighborhood of ${esc(focus)}. Click another node to refocus.` : "Click any node to focus its 1-hop neighborhood and blast radius."}</div>`}</div>`;
      }

      function renderQuery() {
        const meta = {
          query: "Target graph · Loading phase · configuration-independent",
          cquery: "Configured graph · Analysis phase · flag-dependent",
          aquery: "Action graph · Execution plan · flag-dependent",
        };
        const examples = QUERY_EXAMPLES[state.queryMode];

        let results = "";
        if (state.queryMode === "query") {
          const matches = state.queryExpr.includes("somepath")
            ? ["//app:server", "//app/lib:parser", "//app/lib:parser_proto"]
            : state.queryExpr.includes('".*_test"')
              ? ["//app/lib:parser_test", "//app/lib:parser_fuzz_test", "//app/lsp:completion_test"]
              : state.queryExpr.includes("intersect")
                ? ["//app/lib:parser", "//common:flags", "//common:diagnostics"]
                : [
                    "//app:server",
                    "//app/lib:parser",
                    "//app/cli:zeal_cli",
                    "//app/lib:parser_test",
                    "//tools:docgen",
                  ];
          const tests = matches.filter((m) => {
            const t = TARGET_MAP.get(m);
            return t?.role === "test" && !t.tags.includes("manual");
          });

          results = `
            <div class="section-head">
              <div style="display:flex;align-items:center;gap:12px">
                <span class="section-title">${matches.length} targets</span>
                <div class="sub-switch">
                  <button class="${state.queryResultView === "table" ? "active" : ""}" onclick="state.queryResultView='table';renderMain()">Table</button>
                  <button class="${state.queryResultView === "raw" ? "active" : ""}" onclick="state.queryResultView='raw';renderMain()">Raw</button>
                  <button class="${state.queryResultView === "graph" ? "active" : ""}" onclick="state.queryResultView='graph';renderMain()">Graph</button>
                </div>
                <span id="query-stale-note" class="mono" style="font-size:11px;color:var(--warn);display:${state.queryStale ? "inline" : "none"}">Edited · Run ⌘↵</span>
              </div>
              <div class="view-actions">
                <button class="ghost-btn" onclick="copyText('${esc(matches.join("\\n"))}', 'Copied output')">Copy output</button>
                ${tests.length ? `<button class="btn" onclick="runBazel('test', '${esc(tests.join(" "))}')">Test matched (${tests.length})</button>` : ""}
              </div>
            </div>
            ${
              state.queryResultView === "table"
                ? `<table class="lens-table"><thead><tr><th>Target</th><th>Rule</th><th>Package</th></tr></thead><tbody>${matches
                    .map((m) => {
                      const t = TARGET_MAP.get(m);
                      return `<tr class="clickable ${state.inspector?.kind === "target" && state.inspector.id === m ? "selected" : ""}" onclick="inspectTarget('${m}')"><td class="mono">${esc(m)}</td><td class="mono" style="color:var(--fg-muted)">${esc(t?.ruleClass || "external")}</td><td class="mono" style="color:var(--fg-dim)">${t ? "//" + esc(t.pkg) : "—"}</td></tr>`;
                    })
                    .join("")}</tbody></table>`
                : state.queryResultView === "raw"
                  ? `<pre class="code-box">${esc(matches.join("\n"))}</pre>`
                  : renderHonestGraph(matches)
            }`;
        } else if (state.queryMode === "cquery") {
          const cts = getConfiguredTargets(state.queryBuildFlags);
          const ctRow = (
            c,
          ) => `<tr class="clickable ${state.inspector?.kind === "configured" && state.inspector.id === c.id ? "selected" : ""}" onclick="pushInspector({kind:'configured',id:'${c.id}',tab:'config'}, false);render()">
            <td class="mono">${esc(c.label)}</td>
            <td class="mono" style="color:${c.isExec ? "var(--fg-muted)" : "var(--fg)"}">${esc(c.config)} <span style="color:var(--fg-dim)">(${esc(c.hash)})</span>${c.isExec ? ` <span style="color:var(--fg-dim)">exec</span>` : ""}</td>
            <td class="mono" style="color:var(--fg-muted)">${esc(c.ruleClass)}</td>
            <td class="mono" style="color:var(--fg-dim)">${c.resolvedAttrs.length ? `${c.resolvedAttrs.length} select()` : "—"}</td>
          </tr>`;

          results = `
            <div class="section-head">
              <div style="display:flex;align-items:center;gap:12px">
                <span class="section-title">${cts.length} configured targets</span>
                <div class="sub-switch">
                  <button class="${state.queryResultView !== "raw" ? "active" : ""}" onclick="state.queryResultView='table';renderMain()">Table</button>
                  <button class="${state.queryResultView === "raw" ? "active" : ""}" onclick="state.queryResultView='raw';renderMain()">Raw</button>
                </div>
                <span id="query-stale-note" class="mono" style="font-size:11px;color:var(--warn);display:${state.queryStale ? "inline" : "none"}">Edited · Run ⌘↵</span>
              </div>
            </div>
            ${
              state.queryResultView === "raw"
                ? `<pre class="code-box">${esc(cts.map((c) => `${c.label} (${c.hash})${state.queryTransitions && c.transition ? ` [${c.transition}]` : ""}`).join("\n"))}</pre>`
                : `<table class="lens-table"><thead><tr><th>Target</th><th>Configuration</th><th>Rule</th><th>Attributes</th></tr></thead><tbody>${cts.map(ctRow).join("")}</tbody></table>`
            }`;
        } else {
          // aquery (90/8/2 compliant: Mnemonic in --fg, NOT --primary!)
          const allActs = getActions(state.queryBuildFlags);
          const mCounts = new Map();
          allActs.forEach((a) => mCounts.set(a.mnemonic, (mCounts.get(a.mnemonic) || 0) + 1));
          const acts = allActs.filter(
            (a) =>
              (state.aqueryMnemonic === "all" || a.mnemonic === state.aqueryMnemonic) &&
              (!state.aqueryFilter ||
                a.output.toLowerCase().includes(state.aqueryFilter.toLowerCase()) ||
                a.owner.toLowerCase().includes(state.aqueryFilter.toLowerCase())),
          );
          results = `
            <div class="section-head">
              <div style="display:flex;align-items:center;gap:12px">
                <span class="section-title">${acts.length} actions</span>
                <div class="sub-switch">
                  <button class="${state.queryResultView === "table" ? "active" : ""}" onclick="state.queryResultView='table';renderMain()">Table</button>
                  <button class="${state.queryResultView === "raw" ? "active" : ""}" onclick="state.queryResultView='raw';renderMain()">Raw</button>
                </div>
                <span id="query-stale-note" class="mono" style="font-size:11px;color:var(--warn);display:${state.queryStale ? "inline" : "none"}">Edited · Run ⌘↵</span>
              </div>
              <div class="view-actions">
                <select class="input mono" id="aq-mnemonic" style="width:155px" aria-label="Mnemonic filter">
                  <option value="all">All mnemonics (${allActs.length})</option>
                  ${[...mCounts.entries()].map(([m, n]) => `<option value="${m}" ${state.aqueryMnemonic === m ? "selected" : ""}>${esc(m)} (${n})</option>`).join("")}
                </select>
                <input class="input" id="aq-filter" style="width:165px" placeholder="Filter output…" value="${esc(state.aqueryFilter)}" />
              </div>
            </div>
            ${
              state.queryResultView === "raw"
                ? `<pre class="code-box">${esc(acts.map((a) => `action '${a.mnemonic} ${a.owner}'\n  Mnemonic: ${a.mnemonic}\n  Outputs: [${a.output}]\n  Command Line: (${a.args.join(" ")})`).join("\n\n"))}</pre>`
                : `<table class="lens-table"><thead><tr><th>Mnemonic</th><th>Owner</th><th>Primary Output</th><th>Config</th><th style="text-align:right">Inputs</th></tr></thead><tbody>${acts
                    .map(
                      (
                        a,
                      ) => `<tr class="clickable ${state.inspector?.kind === "action" && state.inspector.id === a.id ? "selected" : ""}" onclick="pushInspector({kind:'action',id:'${a.id}',tab:'command'}, false);state.inspectorInputFilter='';render()">
                    <td class="mono" style="font-weight:500">${esc(a.mnemonic)}</td>
                    <td class="mono" style="color:var(--fg-muted)">${esc(a.owner)}</td>
                    <td class="mono" title="${esc(a.output)}">${esc(shortPath(a.output))}</td>
