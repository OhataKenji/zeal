version: v2
modules:
  - path: src-tauri/proto
lint:
  use:
    - STANDARD
  except:
    # Keep the two upstream wire projections in their existing directory.
    - DIRECTORY_SAME_PACKAGE
    - PACKAGE_DIRECTORY_MATCH
    # Preserve upstream packages, service names and google.protobuf.Empty.
    - PACKAGE_VERSION_SUFFIX
    - SERVICE_SUFFIX
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
