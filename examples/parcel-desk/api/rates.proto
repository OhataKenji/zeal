syntax = "proto3";

package dispatch.rates.v1;

enum Zone {
  ZONE_UNSPECIFIED = 0;
  LOCAL = 1;
  REGIONAL = 2;
  REMOTE = 3;
}

message Parcel {
  Zone zone = 1;
  uint32 weight_grams = 2;
}

message Quote {
  uint32 price_cents = 1;
  uint32 transit_days = 2;
}

service RateDesk {
  rpc QuoteParcel(Parcel) returns (Quote);
}
