[tools]
node = "26.13.1"
pnpm = "12.21.0"
gitleaks = "8.30.1"

# Rust is pinned in rust-toolchain.toml.
# This makes mise read it.
[settings]
idiomatic_version_file_enable_tools = ["rust"]

# Checks. CI runs the same commands.
[tasks.check]
description = "Run all checks (frontend, rust, then actions)"
run = [{ task = "check:frontend" }, { task = "check:rust" }, { task = "check:actions" }]

[tasks."check:frontend"]
description = "Format check, lint, test, type check and build the frontend"
run = [
  "pnpm exec oxfmt --check",
  "pnpm lint",
  "pnpm test",
  "pnpm check",
  { task = "build:frontend" },
]

[tasks."check:rust"]
description = "cargo fmt check, clippy and test"
dir = "src-tauri"
# Formatting needs no build. frontendDist is required only by the compile steps.
run = [
  "cargo fmt --all -- --check",
  { task = "build:frontend" },
  "cargo clippy --locked --all-targets -- -D warnings",
  "cargo test --locked",
]

[tasks."check:actions"]
description = "Lint workflows and validate local action definitions"
tools = { actionlint = "1.7.12", action-validator = "0.9.0" }
run = [
  "actionlint",
  'find .github -path ".github/actions/*" -type f \( -name action.yml -o -name action.yaml \) -exec action-validator {} +',
]

[tasks."build:frontend"]
hide = true
run = "pnpm build"

[tasks.fmt]
description = "Format frontend and rust code"
run = ["pnpm exec oxfmt", "cargo fmt --all --manifest-path src-tauri/Cargo.toml"]
