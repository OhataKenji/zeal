name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: |
            - macOS (Apple Silicon): DMG (ad-hoc signed, not notarized).
            - Linux (x86_64 or ARM64): AppImage or `.deb`.

            Install Bazelisk or Bazel separately. Update Zelith manually.
        run: |
          version=$(jq -er '.version | strings | select(length > 0)' src-tauri/tauri.conf.json)
          tag="v$version"
          existing_tag=$(git ls-remote --tags --refs origin "refs/tags/$tag")
          if [[ -n "$existing_tag" ]]; then
            echo "::error::Tag $tag already exists. Use a new version."
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$tag" -f name="Zelith $tag" -f target_commitish="$GITHUB_SHA" \
            -f body="$RELEASE_BODY" -F draft=true --jq '"release_id=\(.id)"' >> "$GITHUB_OUTPUT"

  build-packages:
    needs: create-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
          - platform: ubuntu-22.04-arm
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and upload to draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          args: ${{ matrix.args }} -- --locked
          releaseId: ${{ needs.create-draft.outputs.release_id }}
          uploadUpdaterJson: false
