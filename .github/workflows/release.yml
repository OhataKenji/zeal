name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-tauri:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
          - platform: ubuntu-22.04-arm
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and upload to draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          args: ${{ matrix.args }} -- --locked
          tagName: v__VERSION__
          releaseName: Zelith v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          releaseBody: |
            Download the DMG for macOS on Apple Silicon.
            The macOS app is ad-hoc signed and is not notarized by Apple.
            Download the AppImage or .deb package for Linux on x86_64 or ARM64.
            Install Bazelisk or Bazel separately. Updates are installed manually.

            Maintainer: add release notes and complete docs/release-guide.md before publishing.
