name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select or create the draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: |
            - macOS (Apple Silicon): DMG (ad-hoc signed, not notarized).
            - Linux (x86_64 or ARM64): AppImage or `.deb`.

            Install Bazelisk or Bazel separately. Update Zelith manually.
        run: |
          version=$(jq -er '.version | strings | select(length > 0)' src-tauri/tauri.conf.json)
          tag="v$version"
          existing_tag=$(git ls-remote --tags --refs origin "refs/tags/$tag")
          if [[ -n "$existing_tag" ]]; then
            echo "::error::Tag $tag already exists. Use a new version."
            exit 1
          fi

          releases="repos/$GITHUB_REPOSITORY/releases"
          draft_id=$(gh api --paginate "$releases?per_page=100" | jq -sr --arg tag "$tag" '
            add | map(select(.tag_name == $tag)) |
            if any(.[]; .draft == false) then error("Release \($tag) is already published")
            elif length > 1 then error("Multiple drafts match \($tag)")
            elif length == 1 then .[0].id
            else empty end')
          if [[ -z "$draft_id" ]]; then
            draft_id=$(gh api --method POST "$releases" -f tag_name="$tag" -f name="Zelith $tag" \
              -f target_commitish="$GITHUB_SHA" -f body="$RELEASE_BODY" -F draft=true --jq '.id')
          fi
          [[ "$draft_id" =~ ^[1-9][0-9]*$ ]]
          echo "release_id=$draft_id" >> "$GITHUB_OUTPUT"

  build-packages:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: ubuntu-22.04
            args: --bundles appimage,deb
          - platform: ubuntu-22.04-arm
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and upload to draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          args: ${{ matrix.args }} -- --locked
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          uploadUpdaterJson: false
