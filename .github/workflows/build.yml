name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      # Fail-open: the job runs unless every changed path is listed as
      # irrelevant. Unlisted paths default to running the job, so a stale
      # exclusion list costs an extra run instead of skipping a needed build.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            build:
              - '**'
              - '!docs/**'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!.github/workflows/ci.yml'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'

  tauri-build:
    name: tauri build
    needs: changes
    # On PRs, skip the bundle build only when every changed file is
    # known-irrelevant. main pushes and manual runs always build.
    if: github.event_name != 'pull_request' || needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
