name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    # paths-filter reads the changed-file list through the pull request API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail-open: the job runs unless every changed path is listed as
      # irrelevant. Unlisted paths default to running the job, so a stale
      # exclusion list costs an extra run instead of skipping a needed build.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            build:
              - '**'
              - '!docs/**'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!.github/workflows/ci.yml'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'

  tauri-test:
    name: tauri test (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tauri

      - name: cargo test
        run: cargo test --locked
        working-directory: src-tauri

  tauri-build:
    name: tauri build (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tauri

      - name: Build Tauri bundles
        env:
          # Match tauri-action's DMG packaging on macOS runners.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build -- --locked

  # Branch protection requires a stable check name. Docs-only changes skip
  # the matrices entirely, which is valid, so this always-run gate fails only
  # on failure or cancellation and aggregates under a fixed name.
  build-result:
    name: tauri build
    needs: [changes, tauri-test, tauri-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed or cancelled checks
        if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
