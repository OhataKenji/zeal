name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN; jobs that need more must ask for it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fail-open: the job runs unless every changed path is listed as
      # irrelevant. Unlisted paths default to running the job, so a stale
      # exclusion list costs an extra run instead of skipping a needed build.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            build:
              - '**'
              - '!docs/**'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!.github/workflows/ci.yml'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'

  tauri-build:
    name: tauri build
    needs: changes
    # On PRs, skip the bundle build only when every changed file is
    # known-irrelevant. main pushes and manual runs always build.
    if: github.event_name != 'pull_request' || needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Installs node, pnpm and rust (via rust-toolchain.toml) from mise.toml.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # After the toolchain install: the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No tagName/releaseId, so it only builds and uploads nothing:
      # contents: write is not needed.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single required check for the branch ruleset. A build skipped by
  # paths-filter counts as success; a failed or cancelled one does not.
  build-ok:
    name: build-ok
    needs: [changes, tauri-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check needed jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
