name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    # paths-filter reads the changed-file list through the pull request API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail-open: the job runs unless every changed path is listed as
      # irrelevant. Unlisted paths default to running the job, so a stale
      # exclusion list costs an extra run instead of skipping a needed build.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            build:
              - '**'
              - '!docs/**'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!.github/workflows/ci.yml'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'

  tauri-build:
    name: tauri ${{ matrix.task }} (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        task: [test, build]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      # After the toolchain install: the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.task }}
          # PRs restore main's cache without uploading a PR-scoped copy.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test
        if: matrix.task == 'test'
        run: cargo test --locked
        working-directory: src-tauri

      - name: Build Tauri bundles
        if: matrix.task == 'build'
        env:
          # Match tauri-action's DMG packaging on macOS runners.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build -- --locked

  # Branch protection requires a stable check name, but a matrix job skipped
  # by `if` reports only the literal, unexpanded `tauri ${{ matrix.task }} (${{ matrix.os }})`.
  # This always-run gate aggregates the matrix legs under a fixed name.
  build-result:
    name: tauri build
    needs: [changes, tauri-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Propagate build result
        run: |
          changes="${{ needs.changes.result }}"
          build="${{ needs.tauri-build.result }}"
          if [ "$changes" != "success" ]; then
            echo "::error::change detection $changes"
            exit 1
          fi
          if [ "$build" = "failure" ] || [ "$build" = "cancelled" ]; then
            echo "::error::tauri build $build"
            exit 1
          fi
          echo "tauri build $build"
