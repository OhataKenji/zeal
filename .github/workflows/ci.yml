name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      # Fail-open: a job runs unless every changed path is listed as irrelevant
      # to it. Unlisted paths default to running the job, so a stale exclusion
      # list costs an extra run instead of silently skipping a needed check.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            frontend:
              - '**'
              - '!docs/**'
              - '!src-tauri/**'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!.github/workflows/build.yml'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'
            rust:
              - '**'
              - '!docs/**'
              - '!src/**'
              - '!public/**'
              - '!index.html'
              - '!package.json'
              - '!pnpm-lock.yaml'
              - '!svelte.config.js'
              - '!tsconfig*.json'
              - '!vite.config.ts'
              - '!.oxfmtrc.json'
              - '!.oxlintrc.json'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!.github/workflows/build.yml'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'

  frontend:
    name: frontend (check / format / lint / build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tool versions come from mise.toml.
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (svelte-check + tsc)
        run: pnpm check

      - name: Format check (oxfmt)
        run: pnpm exec oxfmt --check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Build
        run: pnpm build

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        with:
          install_args: gitleaks

      - name: Scan for secrets
        run: gitleaks git --redact .

  rust:
    name: rust (fmt / clippy / test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Installs node, pnpm and rust (via rust-toolchain.toml) from mise.toml.
      - uses: jdx/mise-action@v5

      # frontendDist must exist for tauri::generate_context!
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: cargo fmt
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri
