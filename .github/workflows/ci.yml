name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI changes
    runs-on: ubuntu-latest
    # paths-filter reads the changed-file list through the pull request API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail-open: a job runs unless every changed path is listed as irrelevant
      # to it. Unlisted paths default to running the job, so a stale exclusion
      # list costs an extra run instead of silently skipping a needed check.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            frontend:
              - '**'
              - '!docs/**'
              - '!src-tauri/**'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!.github/workflows/build.yml'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'
            rust:
              - '**'
              - '!docs/**'
              - '!src/**'
              - '!public/**'
              - '!index.html'
              - '!package.json'
              - '!pnpm-lock.yaml'
              - '!svelte.config.js'
              - '!tsconfig*.json'
              - '!vite.config.ts'
              - '!.oxfmtrc.json'
              - '!.oxlintrc.json'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!.github/workflows/build.yml'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'

  frontend:
    name: frontend (check / format / lint / build)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (oxfmt)
        run: pnpm exec oxfmt --check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Type check (svelte-check + tsc)
        run: pnpm check

      - name: Build
        run: pnpm build

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: gitleaks

      - name: Scan for secrets
        run: gitleaks git --redact .

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check TLA+ models
        run: |
          export JAVA="$JAVA_HOME_21_X64/bin/java"
          export TLA2TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar"
          curl --fail --show-error --silent --location --output "$TLA2TOOLS_JAR" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $TLA2TOOLS_JAR" | sha256sum --check
          sh specs/check.sh

  rust:
    name: rust (fmt / clippy / test)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      # After the toolchain install: the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: cargo fmt
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      # frontendDist must exist for tauri::generate_context!
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test --locked
        working-directory: src-tauri

  actions-lint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: false

      - run: mise run check:actions

  # Branch protection requires a stable check name, but a skipped job can
  # report a name that does not match (e.g. an unexpanded matrix name).
  # This always-run gate aggregates every job under one required check.
  ci:
    name: ci
    needs: [changes, frontend, gitleaks, models, rust, actions-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::$failed"
            exit 1
          fi
