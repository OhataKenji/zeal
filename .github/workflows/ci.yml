name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    # paths-filter reads the changed-file list through the pull request API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fail-open: a job runs unless every changed path is listed as irrelevant
      # to it. Unlisted paths default to running the job, so a stale exclusion
      # list costs an extra run instead of silently skipping a needed check.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            frontend:
              - '**'
              - '!docs/**'
              - '!src-tauri/**'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!.github/workflows/build.yml'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'
            rust:
              - '**'
              - '!docs/**'
              - '!src/**'
              - '!public/**'
              - '!index.html'
              - '!package.json'
              - '!pnpm-lock.yaml'
              - '!svelte.config.js'
              - '!tsconfig*.json'
              - '!vite.config.ts'
              - '!.oxfmtrc.json'
              - '!.oxlintrc.json'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!.github/workflows/build.yml'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'

  frontend:
    name: frontend (check / format / lint / build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (svelte-check + tsc)
        run: pnpm check

      - name: Format check (oxfmt)
        run: pnpm exec oxfmt --check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Build
        run: pnpm build

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: gitleaks

      - name: Scan for secrets
        run: gitleaks git --redact .

  rust:
    name: rust (fmt / clippy / test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # After the toolchain install: the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # frontendDist must exist for tauri::generate_context!
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: cargo fmt
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

  # Single required check for the branch ruleset. Jobs skipped by
  # paths-filter count as success; failed or cancelled ones do not.
  ci-ok:
    name: ci-ok
    needs: [changes, frontend, rust, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check needed jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
