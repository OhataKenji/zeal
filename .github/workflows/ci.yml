name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # paths-filter reads the changed-file list through the pull request API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fail-open: a job runs unless every changed path is listed as irrelevant
      # to it. Unlisted paths default to running the job, so a stale exclusion
      # list costs an extra run instead of silently skipping a needed check.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: |
            frontend:
              - '**'
              - '!docs/**'
              - '!src-tauri/**'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'
            rust:
              - '**'
              - '!docs/**'
              - '!src/**'
              - '!public/**'
              - '!index.html'
              - '!package.json'
              - '!pnpm-lock.yaml'
              - '!svelte.config.js'
              - '!tsconfig*.json'
              - '!vite.config.ts'
              - '!.oxfmtrc.json'
              - '!.oxlintrc.json'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'
            build:
              - '**'
              - '!docs/**'
              - '!.vscode/**'
              - '!.github/pull_request_template.md'
              - '!**/*.md'
              - '!LICENSE'
              - '!renovate.json'

  frontend:
    name: frontend (check / format / lint / build)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (oxfmt)
        run: pnpm exec oxfmt --check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Type check (svelte-check + tsc)
        run: pnpm check

      - name: Build
        run: pnpm build

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: gitleaks

      - name: Scan for secrets
        run: gitleaks git --redact .

  rust:
    name: rust (fmt / clippy / test)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # After the toolchain install: the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: cargo fmt
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      # frontendDist must exist for tauri::generate_context!
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

  tauri-build:
    name: tauri build (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      # After the toolchain install: the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Branch protection requires a stable check name, but a skipped job can
  # report a name that does not match (e.g. an unexpanded matrix name).
  # This always-run gate aggregates every job under one required check.
  ci:
    name: ci
    needs: [changes, frontend, gitleaks, rust, tauri-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::$failed"
            exit 1
          fi
