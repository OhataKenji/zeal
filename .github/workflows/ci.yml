name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (check / format / lint / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (svelte-check + tsc)
        run: pnpm check

      - name: Format check (oxfmt)
        run: pnpm exec oxfmt --check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Build
        run: pnpm build

  rust:
    name: rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # https://v2.tauri.app/start/prerequisites/#linux
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # rustup picks up rust-toolchain.toml (stable + rustfmt, clippy)

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: corepack enable

      # frontendDist must exist for tauri::generate_context!
      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: cargo fmt
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri
