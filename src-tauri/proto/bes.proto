// Wire-compatible projection of Google BES v1 and Bazel 8.7 BEP. Unknown
// fields are deliberately skipped. Sources and field numbers are pinned in README.
syntax = "proto3";
package google.devtools.build.v1;

import "google/protobuf/any.proto";
import "google/protobuf/empty.proto";
service PublishBuildEvent {
  rpc PublishLifecycleEvent(PublishLifecycleEventRequest) returns (google.protobuf.Empty);
  rpc PublishBuildToolEventStream(stream PublishBuildToolEventStreamRequest) returns (stream PublishBuildToolEventStreamResponse);
}
message PublishLifecycleEventRequest {}
message StreamId {
  string build_id = 1;
  string invocation_id = 6;
  int32 component = 3;
}
message OrderedBuildEvent {
  StreamId stream_id = 1;
  int64 sequence_number = 2;
  BuildEvent event = 3;
}
message PublishBuildToolEventStreamRequest {
  OrderedBuildEvent ordered_build_event = 4;
}
message PublishBuildToolEventStreamResponse {
  StreamId stream_id = 1;
  int64 sequence_number = 2;
}
message BuildEvent {
  oneof event {
    ComponentStreamFinished component_stream_finished = 59;
    google.protobuf.Any bazel_event = 60;
  }
}
message ComponentStreamFinished {
  int32 type = 1;
}
