[package]
name = "zeal"
version = "0.1.0"
description = "A local first Bazel GUI Client"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "zeal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
quick-xml = "0.38"
uuid = { version = "1.28.0", features = ["v4"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
libc = "0.2"

tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["net"] }
rusqlite = { version = "0.38", features = ["bundled"] }
