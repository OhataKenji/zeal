[package]
name = "zeal"
version = "0.1.0"
description = "A local first Bazel GUI Client"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "zeal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }
tonic-build = "0.12.3"
prost-build = "0.13.5"
protoc-bin-vendored = "3.3.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
quick-xml = "0.38"
uuid = { version = "1.28.0", features = ["v4"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
libc = "0.2"
rustix = { version = "1.1.5", features = ["event", "fs", "process", "termios"] }
rustix-openpty = "0.2"

rusqlite = { version = "0.38", features = ["bundled"] }
tonic = "0.12.3"
prost = "0.13.5"
prost-types = "0.13.5"
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-stream = { version = "0.1", features = ["net"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
  "trace",
  "http-proto",
] }
opentelemetry-http = { version = "0.33", default-features = false, features = [
  "reqwest",
  "reqwest-blocking",
] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
async-trait = "0.1"
url = "2"
tracing = { version = "0.1", default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
tracing-opentelemetry = { version = "0.34", default-features = false }

[dev-dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio"] }
